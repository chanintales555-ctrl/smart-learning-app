<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>NJ Tutor · English Chapter 2 : Parts of Speech (Smartboard)</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg-board: #14171c;
  --grid-line: rgba(255, 255, 255, 0.055);
  --grid-major: rgba(255, 255, 255, 0.10);
  --panel-bg: #1b1f27;
  --panel-border: #2d3545;
  --text-main: #f1f5f9;
  --text-muted: #94a3b8;
  --accent-orange: #fb923c;
  --accent-yellow: #facc15;
  --accent-green: #4ade80;
  --accent-cyan: #38bdf8;
  --accent-pink: #f472b6;
  --accent-purple: #c084fc;
  --accent-red: #f87171;
  --table-border: #cbd5e1;
  --card-bg: rgba(30, 41, 59, 0.55);
}

body.light-board {
  --bg-board: #f8fafc;
  --grid-line: rgba(15, 23, 42, 0.06);
  --grid-major: rgba(15, 23, 42, 0.12);
  --panel-bg: #ffffff;
  --panel-border: #cbd5e1;
  --text-main: #0f172a;
  --text-muted: #475569;
  --accent-orange: #ea580c;
  --accent-yellow: #ca8a04;
  --accent-green: #16a34a;
  --accent-cyan: #0284c7;
  --accent-pink: #db2777;
  --accent-purple: #7e22ce;
  --accent-red: #dc2626;
  --table-border: #334155;
  --card-bg: rgba(241, 245, 249, 0.75);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
  -webkit-user-select: none;
}

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

html, body {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background-color: var(--bg-board);
  color: var(--text-main);
  font-family: 'Prompt', 'Sarabun', sans-serif;
}

/* Main App Container */
#app {
  display: flex;
  width: 100vw;
  height: 100vh;
  position: relative;
}

/* Left Sidebar: Table of Contents (Fixed overlay so opening/closing never reflows slide text or shifts strokes) */
#sidebar {
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  width: 310px;
  min-width: 310px;
  height: 100vh;
  background: var(--panel-bg);
  border-right: 1px solid var(--panel-border);
  display: flex;
  flex-direction: column;
  z-index: 150;
  transform: translateX(0);
  transition: transform 0.26s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 8px 0 28px rgba(0,0,0,0.55);
}

#sidebar.collapsed {
  transform: translateX(-105%);
}

.sidebar-header {
  padding: 14px 16px;
  border-bottom: 1px solid var(--panel-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: linear-gradient(135deg, rgba(251,146,60,0.15), rgba(56,189,248,0.1));
}

.sidebar-brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.sidebar-brand-icon {
  width: 34px;
  height: 34px;
  border-radius: 9px;
  background: linear-gradient(135deg, #f97316, #ec4899);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  color: #fff;
  font-size: 16px;
  box-shadow: 0 2px 8px rgba(249,115,22,0.4);
}

.sidebar-brand-text h1 {
  font-size: 15px;
  font-weight: 700;
  color: var(--text-main);
  line-height: 1.2;
}

.sidebar-brand-text span {
  font-size: 11px;
  color: var(--text-muted);
}

.sidebar-search {
  padding: 10px 12px;
  border-bottom: 1px solid var(--panel-border);
}

.sidebar-search input {
  width: 100%;
  padding: 7px 12px;
  border-radius: 8px;
  border: 1px solid var(--panel-border);
  background: rgba(0,0,0,0.2);
  color: var(--text-main);
  font-family: inherit;
  font-size: 13px;
  outline: none;
}

body.light-board .sidebar-search input {
  background: #f1f5f9;
}

.sidebar-search input:focus {
  border-color: var(--accent-cyan);
}

#toc-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px 8px 24px 8px;
}

#toc-list::-webkit-scrollbar {
  width: 6px;
}
#toc-list::-webkit-scrollbar-thumb {
  background: rgba(148,163,184,0.3);
  border-radius: 3px;
}

.toc-group {
  margin-bottom: 8px;
  border-radius: 9px;
  overflow: hidden;
  border: 1px solid rgba(148,163,184,0.12);
  background: rgba(255,255,255,0.015);
}

.toc-group-header {
  padding: 9px 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(255,255,255,0.03);
  transition: background 0.15s;
}

.toc-group-header:hover {
  background: rgba(56,189,248,0.12);
}

.toc-group-items {
  display: flex;
  flex-direction: column;
  padding: 4px;
}

.toc-group.closed .toc-group-items {
  display: none;
}

.toc-item {
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 12.5px;
  color: var(--text-muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  transition: all 0.15s;
}

.toc-item:hover {
  background: rgba(255,255,255,0.06);
  color: var(--text-main);
}

.toc-item.active {
  background: rgba(56,189,248,0.18);
  color: var(--accent-cyan);
  font-weight: 600;
  border-left: 3px solid var(--accent-cyan);
}

.toc-item-badges {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}

.badge-page {
  font-size: 10.5px;
  padding: 1px 6px;
  border-radius: 4px;
  background: rgba(148,163,184,0.15);
  color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace;
}

.toc-item.active .badge-page {
  background: var(--accent-cyan);
  color: #0f172a;
  font-weight: 700;
}

.badge-3d {
  font-size: 9.5px;
  padding: 1px 4px;
  border-radius: 4px;
  background: rgba(244,114,182,0.2);
  color: #f472b6;
  border: 1px solid rgba(244,114,182,0.4);
}

.badge-anim {
  font-size: 9.5px;
  padding: 1px 4px;
  border-radius: 4px;
  background: rgba(74,222,128,0.2);
  color: #4ade80;
  border: 1px solid rgba(74,222,128,0.4);
}

.badge-quiz {
  font-size: 9.5px;
  padding: 1px 4px;
  border-radius: 4px;
  background: rgba(250,204,21,0.2);
  color: #facc15;
}

/* Main Workspace Area */
#main-area {
  flex: 1;
  height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}

/* Top Bar */
#topbar {
  height: 52px;
  min-height: 52px;
  background: var(--panel-bg);
  border-bottom: 1px solid var(--panel-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  z-index: 40;
}

.topbar-left, .topbar-center, .topbar-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

.icon-btn {
  height: 34px;
  padding: 0 11px;
  border-radius: 8px;
  border: 1px solid var(--panel-border);
  background: rgba(255,255,255,0.04);
  color: var(--text-main);
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s;
}

.icon-btn:hover {
  background: rgba(56,189,248,0.15);
  border-color: var(--accent-cyan);
}

.icon-btn.primary {
  background: linear-gradient(135deg, #0284c7, #2563eb);
  border-color: #38bdf8;
  color: #fff;
}

.slide-nav-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(0,0,0,0.25);
  padding: 3px 8px;
  border-radius: 10px;
  border: 1px solid var(--panel-border);
}

body.light-board .slide-nav-pill {
  background: #f1f5f9;
}

#page-indicator {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 600;
  min-width: 90px;
  text-align: center;
  cursor: pointer;
}

/* Interactive Feature Launch Buttons (Small buttons on top bar / slide corner) */
#feature-buttons-container {
  display: flex;
  align-items: center;
  gap: 8px;
}

.feature-trigger-btn {
  height: 34px;
  padding: 0 12px;
  border-radius: 18px;
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  display: none;
  align-items: center;
  gap: 6px;
  transition: transform 0.15s, box-shadow 0.15s;
  animation: pulseSubtle 2.5s infinite;
}

.feature-trigger-btn.show {
  display: inline-flex;
}

.feature-trigger-btn.btn-3d {
  background: linear-gradient(135deg, #db2777, #9333ea);
  color: #fff;
  border: 1px solid #f472b6;
  box-shadow: 0 0 14px rgba(244, 114, 182, 0.45);
}

.feature-trigger-btn.btn-anim {
  background: linear-gradient(135deg, #059669, #0284c7);
  color: #fff;
  border: 1px solid #4ade80;
  box-shadow: 0 0 14px rgba(74, 222, 128, 0.4);
}

.feature-trigger-btn:hover {
  transform: scale(1.04);
}

@keyframes pulseSubtle {
  0%, 100% { filter: brightness(1); }
  50% { filter: brightness(1.18); }
}

/* Smartboard Viewport */
#board-viewport {
  flex: 1;
  width: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  position: relative;
  background-color: var(--bg-board);
  background-image:
    linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px),
    linear-gradient(to right, var(--grid-major) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid-major) 1px, transparent 1px);
  background-size: 28px 28px, 28px 28px, 140px 140px, 140px 140px;
}

#board-stage {
  position: relative;
  width: 1180px;
  margin: 0 auto;
  min-height: 1180px;
  padding: 28px 44px 120px 44px;
}

/* Content Layer (Teacher's Slide Structure: Headings + Illustrations + Empty Frameworks) */
#slide-content-layer {
  position: relative;
  z-index: 10;
  width: 100%;
  max-width: none;
  margin: 0;
  pointer-events: none; /* Let pen strokes pass through unless interactive element */
}

#slide-content-layer .interactive-el {
  pointer-events: auto;
}

/* Drawing Canvas Layer */
#drawing-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 20;
  touch-action: none;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  cursor: crosshair;
}

#drawing-canvas.pan-mode {
  pointer-events: none;
  touch-action: pan-y;
}

/* Active Stroke Overlay Canvas (Zero-latency incremental rendering for Apple Pencil) */
#active-stroke-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 22;
  pointer-events: none;
  touch-action: none;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}

/* Prevent resting palm from clicking floating toolbar while actively drawing a stroke */
body.is-drawing #pen-toolbar {
  pointer-events: none;
}

/* Laser Pointer Trail Canvas */
#laser-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 25;
  pointer-events: none;
}

/* Handwritten-style / Smartboard Slide Typography & Components */
.slide-header-box {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 22px;
  padding-bottom: 12px;
  border-bottom: 2px dashed rgba(251, 146, 60, 0.45);
}

.slide-main-title {
  font-size: 32px;
  font-weight: 700;
  color: var(--accent-orange);
  letter-spacing: 0.3px;
  display: flex;
  align-items: center;
  gap: 14px;
  text-shadow: 0 2px 12px rgba(251, 146, 60, 0.2);
}

.slide-num-circle {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 2.5px solid var(--accent-pink);
  color: var(--accent-pink);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: 700;
  flex-shrink: 0;
}

.slide-subtitle-badge {
  font-size: 16px;
  font-weight: 600;
  padding: 5px 14px;
  border-radius: 20px;
  background: rgba(56, 189, 248, 0.12);
  border: 1.5px solid var(--accent-cyan);
  color: var(--accent-cyan);
}

/* Smartboard Tables (matching overview.pdf yellow/white clean lines with large blank writing cells) */
.sb-table {
  width: 100%;
  border-collapse: collapse;
  margin: 14px 0 24px 0;
  border: 2px solid var(--accent-yellow);
}

.sb-table th, .sb-table td {
  border: 1.5px solid rgba(250, 204, 21, 0.65);
  padding: 14px 18px;
  vertical-align: top;
}

body.light-board .sb-table,
body.light-board .sb-table th,
body.light-board .sb-table td {
  border-color: #475569;
}

.sb-table th {
  font-size: 21px;
  font-weight: 600;
  color: var(--accent-yellow);
  background: rgba(250, 204, 21, 0.06);
  text-align: center;
}

.sb-table td.row-label {
  font-size: 19px;
  font-weight: 600;
  color: var(--accent-cyan);
  width: 200px;
  text-align: center;
  vertical-align: middle;
  background: rgba(56, 189, 248, 0.05);
}

.sb-write-space {
  min-height: 150px;
  position: relative;
}

.sb-write-space-lg {
  min-height: 280px;
  position: relative;
}

.sb-write-space-xl {
  min-height: 520px;
  position: relative;
}

/* Smartboard Layout Grids */
.sb-grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 28px;
  margin-bottom: 24px;
}

.sb-grid-3 {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 22px;
  margin-bottom: 24px;
}

.sb-card {
  border: 2px solid rgba(148, 163, 184, 0.35);
  border-radius: 14px;
  padding: 18px 22px;
  background: rgba(15, 23, 42, 0.28);
  position: relative;
}

body.light-board .sb-card {
  background: rgba(255, 255, 255, 0.55);
  border-color: #94a3b8;
}

.sb-card-title {
  font-size: 22px;
  font-weight: 700;
  color: var(--accent-green);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.sb-branch-list {
  display: flex;
  flex-direction: column;
  gap: 26px;
  padding-left: 18px;
  border-left: 3px solid var(--accent-yellow);
  margin: 14px 0 22px 12px;
}

.sb-branch-item {
  position: relative;
  padding-left: 24px;
  font-size: 21px;
  font-weight: 600;
  color: var(--text-main);
}

.sb-branch-item::before {
  content: "";
  position: absolute;
  left: -18px;
  top: 15px;
  width: 30px;
  height: 2.5px;
  background: var(--accent-yellow);
}

.sb-blank-line {
  display: inline-block;
  border-bottom: 2px dotted rgba(148, 163, 184, 0.55);
  min-width: 220px;
  height: 30px;
  vertical-align: bottom;
  margin: 0 6px;
}

/* Exercise & Real Exam Boxes */
.quiz-problem-box {
  border: 2px solid var(--accent-cyan);
  border-radius: 14px;
  padding: 20px 26px;
  background: rgba(15, 23, 42, 0.5);
  margin-bottom: 22px;
}

body.light-board .quiz-problem-box {
  background: rgba(241, 245, 249, 0.85);
}

.quiz-question-text {
  font-size: 22px;
  font-weight: 600;
  line-height: 1.55;
  color: var(--text-main);
  margin-bottom: 14px;
}

.quiz-choices-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px 28px;
  margin-top: 12px;
  font-size: 20px;
  color: var(--accent-yellow);
}

.quiz-work-header {
  font-size: 19px;
  font-weight: 700;
  color: var(--accent-green);
  text-decoration: underline;
  margin-bottom: 10px;
}

/* Floating Bottom Pen & Annotation Toolbar */
#pen-toolbar {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(27, 31, 39, 0.95);
  backdrop-filter: blur(12px);
  border: 1px solid var(--panel-border);
  border-radius: 20px;
  padding: 7px 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  z-index: 60;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
}

body.light-board #pen-toolbar {
  background: rgba(255, 255, 255, 0.95);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
}

.tool-btn {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-main);
  font-size: 17px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}

.tool-btn:hover {
  background: rgba(255,255,255,0.08);
}

.tool-btn.active {
  background: rgba(56, 189, 248, 0.22);
  border-color: var(--accent-cyan);
  color: var(--accent-cyan);
  transform: translateY(-2px);
}

.tool-divider {
  width: 1px;
  height: 26px;
  background: var(--panel-border);
  margin: 0 2px;
}

.color-swatch {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
  transition: transform 0.15s;
}

.color-swatch.active {
  transform: scale(1.25);
  border-color: #fff;
  box-shadow: 0 0 8px currentColor;
}

.size-slider {
  width: 72px;
  accent-color: var(--accent-cyan);
  cursor: pointer;
}

/* Fullscreen Modal Overlay for 3D Labs & Animation Graphics */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10, 12, 16, 0.96);
  z-index: 200;
  display: none;
  flex-direction: column;
}

.modal-overlay.open {
  display: flex;
}

.modal-header {
  height: 58px;
  padding: 0 24px;
  background: #161922;
  border-bottom: 1px solid #2d3545;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.modal-title {
  font-size: 19px;
  font-weight: 700;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 12px;
}

.modal-body {
  flex: 1;
  display: flex;
  position: relative;
  overflow: hidden;
}

.lab-stage {
  flex: 1;
  position: relative;
  height: 100%;
  background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
}

.lab-controls {
  width: 360px;
  background: #161922;
  border-left: 1px solid #2d3545;
  padding: 20px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
  color: #f1f5f9;
}

.lab-control-card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  padding: 14px;
}

.lab-control-card h4 {
  font-size: 14px;
  color: #38bdf8;
  margin-bottom: 10px;
}

.lab-btn {
  width: 100%;
  padding: 10px 14px;
  border-radius: 9px;
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.07);
  color: #fff;
  font-family: inherit;
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  margin-bottom: 8px;
  transition: all 0.15s;
}

.lab-btn:hover {
  background: rgba(56,189,248,0.25);
  border-color: #38bdf8;
}

.lab-btn.active {
  background: linear-gradient(135deg, #0284c7, #2563eb);
  border-color: #38bdf8;
}

/* Single Question Navigation Bar (for Exercises & Real Exam Deck) */
#question-nav-bar {
  display: none;
  min-height: 48px;
  background: linear-gradient(90deg, rgba(15, 23, 42, 0.96), rgba(30, 41, 59, 0.96));
  border-bottom: 2px solid var(--accent-yellow);
  padding: 6px 18px;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  z-index: 38;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
}

body.light-board #question-nav-bar {
  background: linear-gradient(90deg, #fefce8, #f0f9ff);
  border-bottom: 2px solid #ca8a04;
}

#question-nav-bar.show {
  display: flex;
}

.qnav-left, .qnav-center, .qnav-right {

<script>
let boardZoom = 1.0;

function setBoardZoom(nextZoom, clientX, clientY) {
  const viewport = document.getElementById('board-viewport');
  const prevZoom = boardZoom;
  boardZoom = Math.min(2.8, Math.max(0.55, Math.round(nextZoom * 1000) / 1000));
  if (Math.abs(boardZoom - prevZoom) < 0.001) return;

  let anchorRatioX = 0.5, anchorRatioY = 0.2;
  let relX = 0, relY = 0;
  if (viewport && typeof clientX === 'number' && typeof clientY === 'number') {
    const vr = viewport.getBoundingClientRect();
    relX = clientX - vr.left;
    relY = clientY - vr.top;
    const totalW = Math.max(1, viewport.scrollWidth);
    const totalH = Math.max(1, viewport.scrollHeight);
    anchorRatioX = (viewport.scrollLeft + relX) / totalW;
    anchorRatioY = (viewport.scrollTop + relY) / totalH;
  }

  resizeBoardCanvases(false);

  if (viewport && typeof clientX === 'number' && typeof clientY === 'number') {
    viewport.scrollLeft = Math.max(0, anchorRatioX * viewport.scrollWidth - relX);
    viewport.scrollTop = Math.max(0, anchorRatioY * viewport.scrollHeight - relY);
    if (typeof updateCanvasMetrics === 'function') updateCanvasMetrics();
  }
}

let _pinRafPending = false;
function schedulePinFloatingUI() {
  if (_pinRafPending) return;
  _pinRafPending = true;
  requestAnimationFrame(() => {
    _pinRafPending = false;
    pinFloatingUIOnZoom();
  });
}

function pinFloatingUIOnZoom() {
  const vv = window.visualViewport;
  const toolbar = document.getElementById('pen-toolbar');
  const topbar = document.getElementById('topbar');
  const qnav = document.getElementById('question-nav-bar');
  if (!vv || !toolbar) return;

  const scale = vv.scale || 1;
  const invScale = 1 / scale;

  if (scale <= 1.005) {
    toolbar.style.position = 'fixed';
    toolbar.style.left = '50%';
    toolbar.style.top = 'auto';
    toolbar.style.bottom = '16px';
    toolbar.style.transformOrigin = 'bottom center';
    toolbar.style.transform = 'translateX(-50%)';

    if (topbar) {
      topbar.style.position = 'fixed';
      topbar.style.left = '0px';
      topbar.style.top = '0px';
      topbar.style.width = '100%';
      topbar.style.transformOrigin = 'top left';
      topbar.style.transform = 'none';
    }
    if (qnav) {
      qnav.style.position = '';
      qnav.style.left = '';
      qnav.style.top = '';
      qnav.style.width = '';
      qnav.style.transform = '';
      qnav.style.zIndex = '';
    }
    return;
  }

  const centerX = vv.offsetLeft + vv.width / 2;
  const bottomY = vv.offsetTop + vv.height - 16 * invScale;
  toolbar.style.position = 'fixed';
  toolbar.style.left = centerX + 'px';
  toolbar.style.top = bottomY + 'px';
  toolbar.style.bottom = 'auto';
  toolbar.style.transformOrigin = 'bottom center';
  toolbar.style.transform = `translate(-50%, -100%) scale(${invScale})`;

  if (topbar) {
    topbar.style.position = 'fixed';
    topbar.style.left = vv.offsetLeft + 'px';
    topbar.style.top = vv.offsetTop + 'px';
    topbar.style.width = (vv.width * scale) + 'px';
    topbar.style.transformOrigin = 'top left';
    topbar.style.transform = `scale(${invScale})`;
  }

  if (qnav && qnav.classList.contains('show')) {
    qnav.style.position = 'fixed';
    qnav.style.left = vv.offsetLeft + 'px';
    qnav.style.top = (vv.offsetTop + 52 * invScale) + 'px';
    qnav.style.width = (vv.width * scale) + 'px';
    qnav.style.transformOrigin = 'top left';
    qnav.style.transform = `scale(${invScale})`;
    qnav.style.zIndex = '75';
  } else if (qnav) {
    qnav.style.position = '';
    qnav.style.transform = '';
  }
}

if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', schedulePinFloatingUI);
  window.visualViewport.addEventListener('scroll', schedulePinFloatingUI);
}
window.addEventListener('resize', schedulePinFloatingUI);

window.addEventListener('wheel', (e) => {
  if (e.ctrlKey || e.metaKey) {
    e.preventDefault();
    const factor = Math.exp(-e.deltaY * 0.0022);
    setBoardZoom(boardZoom * factor, e.clientX, e.clientY);
  }
}, { passive: false });

window.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && (e.key === '+' || e.key === '=')) {
    e.preventDefault();
    setBoardZoom(boardZoom + 0.15, window.innerWidth / 2, window.innerHeight / 2);
  } else if ((e.ctrlKey || e.metaKey) && (e.key === '-' || e.key === '_')) {
    e.preventDefault();
    setBoardZoom(boardZoom - 0.15, window.innerWidth / 2, window.innerHeight / 2);
  } else if ((e.ctrlKey || e.metaKey) && e.key === '0') {
    e.preventDefault();
    setBoardZoom(1.0);
  }
}, { passive: false });

const SoundFX = {
  ctx: null,
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  },
  click() {
    try {
      this.init();
      if (!this.ctx) return;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(620, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(220, this.ctx.currentTime + 0.045);
      gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.045);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.05);
    } catch(e) {}
  },
  drop() {
    try {
      this.init();
      if (!this.ctx) return;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(320, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(980, this.ctx.currentTime + 0.09);
      gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.1);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.1);
    } catch(e) {}
  },
  fizz() {
    try {
      this.init();
      if (!this.ctx) return;
      const bufferSize = this.ctx.sampleRate * 0.35;
      const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
      const noise = this.ctx.createBufferSource();
      noise.buffer = buffer;
      const filter = this.ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 1800;
      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(0.09, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.002, this.ctx.currentTime + 0.35);
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(this.ctx.destination);
      noise.start();
    } catch(e) {}
  },
  chime() {
    try {
      this.init();
      if (!this.ctx) return;
      [523.25, 659.25, 783.99].forEach((freq, idx) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.06);
        gain.gain.setValueAtTime(0.09, this.ctx.currentTime + idx * 0.06);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.06 + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(this.ctx.currentTime + idx * 0.06);
        osc.stop(this.ctx.currentTime + idx * 0.06 + 0.26);
      });
    } catch(e) {}
  }
};

// ====================================================
// 2. SMARTBOARD DRAWING & ACCOUNT STORAGE ENGINE
// ====================================================
let currentSlideIndex = 0;
let currentDrawTool = 'pen';
let currentPenColor = '#ffffff';
let currentPenSize = 3;
let isDrawing = false;
let currentStroke = null;

// Apple Pencil & Palm Rejection State
let palmRejectionEnabled = true; // เปิดโหมดกันอุ้งมือเป็นค่าเริ่มต้นสำหรับผู้ใช้ Apple Pencil
let activePointerId = null;
let activePointerType = null;
let lastPenTimestamp = 0;

// Cached Canvas Metrics & Dirty-Rect State (Zero-Reflow & O(1) Incremental Rendering)
const CANONICAL_STAGE_WIDTH = 1180;
let cachedCanvasRect = null;
let cachedStageW = CANONICAL_STAGE_WIDTH;
let lastCanvasW = 0;
let lastCanvasH = 0;
let lastCanvasDpr = 0;
let activeDirtyBox = null;

// Per-slide vector stroke storage: { [slideId]: [ strokeObj, ... ] }
let slideAnnotations = {};
let redoStacks = {};

const drawCanvas = document.getElementById('drawing-canvas');
const drawCtx = drawCanvas.getContext('2d');
const activeCanvas = document.getElementById('active-stroke-canvas');
const activeCtx = activeCanvas.getContext('2d');
const laserCanvas = document.getElementById('laser-canvas');
const laserCtx = laserCanvas.getContext('2d');
let laserPoints = [];
let laserDirtyBox = null;

function getSlideLogicalWidth(idx = currentSlideIndex) {
  const key = getSlideKey(idx);
  const strokes = slideAnnotations[key];
  if (Array.isArray(strokes) && strokes.length > 0) {
    for (let i = 0; i < strokes.length; i++) {
      const s = strokes[i];
      if (s && s.stageW && s.stageW >= 560 && s.stageW <= 2600) {
        return Math.round(s.stageW);
      }
      if (s && Array.isArray(s.points)) {
        for (let j = 0; j < s.points.length; j++) {
          const pt = s.points[j];
          if (pt && typeof pt.x === 'number' && typeof pt.nx === 'number' && pt.nx > 0.08 && pt.x > 60) {
            const inferred = Math.round(pt.x / pt.nx);
            if (inferred >= 560 && inferred <= 2600) {
              return inferred;
            }
          }
        }
      }
    }
  }
  return CANONICAL_STAGE_WIDTH;
}

function updateCanvasMetrics() {
  cachedCanvasRect = drawCanvas.getBoundingClientRect();
  cachedStageW = lastCanvasW || drawCanvas.clientWidth || CANONICAL_STAGE_WIDTH;
}

const boardViewportEl = document.getElementById('board-viewport');
if (boardViewportEl) {
  boardViewportEl.addEventListener('scroll', updateCanvasMetrics, { passive: true });
}

function expandActiveDirtyBox(x, y, pad) {
  const minX = x - pad;
  const minY = y - pad;
  const maxX = x + pad;
  const maxY = y + pad;
  if (!activeDirtyBox) {
    activeDirtyBox = { minX, minY, maxX, maxY };
  } else {
    if (minX < activeDirtyBox.minX) activeDirtyBox.minX = minX;
    if (minY < activeDirtyBox.minY) activeDirtyBox.minY = minY;
    if (maxX > activeDirtyBox.maxX) activeDirtyBox.maxX = maxX;
    if (maxY > activeDirtyBox.maxY) activeDirtyBox.maxY = maxY;
  }
}

function clearActiveDirtyBox() {
  if (!activeDirtyBox) return;
  const x = Math.max(0, Math.floor(activeDirtyBox.minX - 6));
  const y = Math.max(0, Math.floor(activeDirtyBox.minY - 6));
  const w = Math.ceil(activeDirtyBox.maxX - x + 12);
  const h = Math.ceil(activeDirtyBox.maxY - y + 12);
  activeCtx.clearRect(x, y, w, h);
  activeDirtyBox = null;
}

function getStrokePadding(s) {
  if (!s) return 16;
  if (s.tool === 'eraser') return s.size * 5.5 + 8;
  if (s.tool === 'highlighter') return s.size * 4.2 + 8;
  return s.size + 8;
}

function resizeBoardCanvases(forceRedraw = false) {
  const viewport = document.getElementById('board-viewport');
  const stage = document.getElementById('board-stage');
  const contentLayer = document.getElementById('slide-content-layer');

  const logicalW = getSlideLogicalWidth(currentSlideIndex);
  stage.style.width = logicalW + 'px';
  // Legacy wide-screen strokes were drawn when content was capped at 1520px and centered
  const legacyWide = logicalW > 1564;
  contentLayer.style.maxWidth = legacyWide ? '1520px' : 'none';
  contentLayer.style.margin = legacyWide ? '0 auto' : '0';

  const targetHeight = Math.max(1180, contentLayer.scrollHeight + 180, window.innerHeight - 52);
  stage.style.minHeight = targetHeight + 'px';

  const zoomWrap = document.getElementById('board-zoom-wrapper');
  const viewportW = (viewport && viewport.clientWidth) ? viewport.clientWidth : window.innerWidth;
  const baseScale = (viewportW > 0 && viewportW < logicalW) ? (viewportW / logicalW) : 1;
  const z = (typeof boardZoom === 'number' && boardZoom > 0) ? boardZoom : 1;
  const totalScale = baseScale * z;

  if (zoomWrap) {
    zoomWrap.style.width = Math.round(logicalW * totalScale) + 'px';
    zoomWrap.style.height = Math.round(targetHeight * totalScale) + 'px';
  }

  if (Math.abs(totalScale - 1) > 0.002) {
    stage.style.transformOrigin = 'top left';
    stage.style.transform = `scale(${totalScale})`;
    stage.style.marginLeft = '0px';
    stage.style.marginRight = '0px';
    stage.style.marginBottom = '0px';
  } else {
    stage.style.transform = 'none';
    stage.style.marginLeft = '0px';
    stage.style.marginRight = '0px';
    stage.style.marginBottom = '0px';
  }

  const dpr = window.devicePixelRatio || 1;
  const newW = Math.round(logicalW);
  const newH = Math.round(targetHeight);

  const dimsChanged = (
    Math.abs(newW - lastCanvasW) > 1 ||
    Math.abs(newH - lastCanvasH) > 2 ||
    dpr !== lastCanvasDpr
  );

  if (dimsChanged) {
    lastCanvasW = newW;
    lastCanvasH = newH;
    lastCanvasDpr = dpr;

    drawCanvas.width = newW * dpr;
    drawCanvas.height = newH * dpr;
    drawCanvas.style.width = newW + 'px';
    drawCanvas.style.height = newH + 'px';
    drawCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

    activeCanvas.width = newW * dpr;
    activeCanvas.height = newH * dpr;
    activeCanvas.style.width = newW + 'px';
    activeCanvas.style.height = newH + 'px';
    activeCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    activeDirtyBox = null;

    laserCanvas.width = newW * dpr;
    laserCanvas.height = newH * dpr;
    laserCanvas.style.width = newW + 'px';
    laserCanvas.style.height = newH + 'px';
    laserCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

    updateCanvasMetrics();
    renderCurrentSlideStrokes();
  } else {
    updateCanvasMetrics();
    if (forceRedraw && !isDrawing) {
      renderCurrentSlideStrokes();
    }
  }
}

window.addEventListener('resize', () => resizeBoardCanvases(false));
if (typeof ResizeObserver !== 'undefined') {
  const slideContentEl = document.getElementById('slide-content-layer');
  if (slideContentEl) {
    const ro = new ResizeObserver(() => {
      if (!isDrawing) resizeBoardCanvases(false);
    });
    ro.observe(slideContentEl);
  }
}
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => {
    if (!isDrawing) resizeBoardCanvases(true);
  });
}

function getSlideKey(idx = currentSlideIndex) {
  const s = SLIDES[idx];
  return s ? s.id : ('slide_' + idx);
}

function renderStroke(ctx, s, stageW) {
  if (!s || !s.points || s.points.length === 0) return;
  const pts = s.points;
  const len = pts.length;
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  let lw = s.size;
  if (s.tool === 'eraser') {
    ctx.globalCompositeOperation = 'destination-out';
    lw = s.size * 5.5;
    ctx.lineWidth = lw;
    ctx.fillStyle = '#000000';
  } else if (s.tool === 'highlighter') {
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = s.color;
    ctx.fillStyle = s.color;
    ctx.globalAlpha = 0.34;
    lw = s.size * 4.2;
    ctx.lineWidth = lw;
  } else {
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = s.color;
    ctx.fillStyle = s.color;
    ctx.globalAlpha = 1.0;
    lw = s.size;
    ctx.lineWidth = lw;
  }

  const x0 = pts[0].nx ? pts[0].nx * stageW : pts[0].x;
  const y0 = pts[0].y;

  if (s.tool === 'line') {
    const last = pts[len - 1];
    const x1 = last.nx ? last.nx * stageW : last.x;
    const y1 = last.y;
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.stroke();
  } else if (s.tool === 'rect') {
    const last = pts[len - 1];
    const x1 = last.nx ? last.nx * stageW : last.x;
    const y1 = last.y;
    ctx.strokeRect(x0, y0, x1 - x0, y1 - y0);
  } else if (len === 1) {
    ctx.beginPath();
    ctx.arc(x0, y0, lw / 2, 0, Math.PI * 2);
    ctx.fill();
  } else {
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    let prevX = x0;
    let prevY = y0;
    for (let i = 1; i < len; i++) {
      const cx = pts[i].nx ? pts[i].nx * stageW : pts[i].x;
      const cy = pts[i].y;
      const midX = (prevX + cx) * 0.5;
      const midY = (prevY + cy) * 0.5;
      ctx.quadraticCurveTo(prevX, prevY, midX, midY);
      prevX = cx;
      prevY = cy;
    }
    ctx.lineTo(prevX, prevY);
    ctx.stroke();
  }
  ctx.restore();
}

function renderEraserTailSegment(ctx, s, stageW) {
  const pts = s.points;
  const len = pts.length;
  if (len === 0) return;
  const lw = s.size * 5.5;
  ctx.save();
  ctx.globalCompositeOperation = 'destination-out';
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.lineWidth = lw;
  ctx.fillStyle = '#000000';

  if (len === 1) {
    const x0 = pts[0].nx ? pts[0].nx * stageW : pts[0].x;
    ctx.beginPath();
    ctx.arc(x0, pts[0].y, lw / 2, 0, Math.PI * 2);
    ctx.fill();
  } else {
    const pPrev = pts[len - 2];
    const pCurr = pts[len - 1];
    const x1 = pPrev.nx ? pPrev.nx * stageW : pPrev.x;
    const y1 = pPrev.y;
    const x2 = pCurr.nx ? pCurr.nx * stageW : pCurr.x;
    const y2 = pCurr.y;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }
  ctx.restore();
}

function drawActiveStrokePreview() {
  if (!currentStroke || currentStroke.points.length === 0) return;
  const stageW = cachedStageW || drawCanvas.clientWidth || 1400;
  const pad = getStrokePadding(currentStroke);

  clearActiveDirtyBox();

  if (currentStroke.tool === 'eraser') {
    const last = currentStroke.points[currentStroke.points.length - 1];
    const rx = last.nx ? last.nx * stageW : last.x;
    const ry = last.y;
    const radius = (currentStroke.size * 5.5) * 0.5;
    expandActiveDirtyBox(rx, ry, radius + 6);
    activeCtx.save();
    activeCtx.beginPath();
    activeCtx.arc(rx, ry, radius, 0, Math.PI * 2);
    activeCtx.strokeStyle = 'rgba(248, 113, 113, 0.85)';
    activeCtx.lineWidth = 2;
    activeCtx.stroke();
    activeCtx.restore();
    return;
  }

  const pts = currentStroke.points;
  for (let i = 0; i < pts.length; i++) {
    const px = pts[i].nx ? pts[i].nx * stageW : pts[i].x;
    expandActiveDirtyBox(px, pts[i].y, pad);
  }
  renderStroke(activeCtx, currentStroke, stageW);
}

function renderCurrentSlideStrokes() {
  const stageW = cachedStageW || drawCanvas.clientWidth || 1400;
  drawCtx.clearRect(0, 0, lastCanvasW || drawCanvas.width, lastCanvasH || drawCanvas.height);
  clearActiveDirtyBox();
  const key = getSlideKey();
  const strokes = slideAnnotations[key] || [];
  for (let i = 0; i < strokes.length; i++) {
    renderStroke(drawCtx, strokes[i], stageW);
  }
  if (currentStroke) {
    drawActiveStrokePreview();
  }
}

function getStageCoords(e) {
  if (!cachedCanvasRect) updateCanvasMetrics();
  const rectW = (cachedCanvasRect && cachedCanvasRect.width > 0) ? cachedCanvasRect.width : cachedStageW;
  const scale = cachedStageW / rectW;
  const rawX = (e.clientX - cachedCanvasRect.left) * scale;
  const rawY = (e.clientY - cachedCanvasRect.top) * scale;
  const x = Math.round(rawX * 10) / 10;
  const y = Math.round(rawY * 10) / 10;
  const nx = Math.round((rawX / cachedStageW) * 100000) / 100000;
  return { x, y, nx };
}

function shouldRejectTouchAsPalm(e) {
  if (e.pointerType !== 'touch') return false;
  // 1) If Palm Rejection mode is ON, reject all finger/palm touches on drawing canvas
  if (palmRejectionEnabled) return true;
  // 2) Even if finger drawing is enabled, reject touch if Apple Pencil is currently drawing or just lifted (<650ms)
  if (isDrawing && activePointerType === 'pen') return true;
  if (performance.now() - lastPenTimestamp < 650) return true;
  // 3) Reject large contact patch (palm resting on screen)
  if ((e.width && e.width > 28) || (e.height && e.height > 28)) return true;
  return false;
}

function commitCurrentStrokeImmediate() {
  if (!currentStroke) return;
  const stageW = cachedStageW || drawCanvas.clientWidth || 1400;
  clearActiveDirtyBox();
  renderStroke(drawCtx, currentStroke, stageW);
  const key = getSlideKey();
  if (!slideAnnotations[key]) slideAnnotations[key] = [];
  slideAnnotations[key].push(currentStroke);
  redoStacks[key] = [];
  currentStroke = null;
  schedulePersistAnnotations();
}

// Suppress iPadOS Scribble (UIScribbleInteraction), double-tap zoom delay, and touch callouts on canvas
drawCanvas.addEventListener('touchstart', (e) => {
  if (currentDrawTool === 'pan') return;
  if (e.cancelable) e.preventDefault();
}, { passive: false });

drawCanvas.addEventListener('touchmove', (e) => {
  if (currentDrawTool === 'pan') return;
  if (e.cancelable) e.preventDefault();
}, { passive: false });

drawCanvas.addEventListener('touchend', (e) => {
  if (currentDrawTool === 'pan') return;
  if (e.cancelable) e.preventDefault();
}, { passive: false });

drawCanvas.addEventListener('contextmenu', (e) => e.preventDefault());
drawCanvas.addEventListener('dblclick', (e) => e.preventDefault());
drawCanvas.addEventListener('selectstart', (e) => e.preventDefault());

drawCanvas.addEventListener('pointerdown', (e) => {
  if (currentDrawTool === 'pan') return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;

  // Palm & Secondary Touch Rejection
  if (shouldRejectTouchAsPalm(e)) {
    if (e.cancelable) e.preventDefault();
    return;
  }

  if (e.cancelable) e.preventDefault();

  if (e.pointerType === 'pen') {
    lastPenTimestamp = performance.now();
    // If an accidental finger/palm stroke was in progress, abort and discard it immediately
    if (isDrawing && activePointerType === 'touch') {
      clearActiveDirtyBox();
      currentStroke = null;
      isDrawing = false;
      activePointerId = null;
    }
  }

  // If a secondary finger touch arrives while already drawing with another finger, ignore it
  if (isDrawing && e.pointerType === 'touch' && activePointerId !== null && e.pointerId !== activePointerId) {
    return;
  }

  // If a rapid new pen stroke arrives before the previous pen stroke closed, commit the previous stroke cleanly
  if (isDrawing && currentStroke) {
    commitCurrentStrokeImmediate();
  }

  updateCanvasMetrics();
  isDrawing = true;
  activePointerId = e.pointerId;
  activePointerType = e.pointerType;
  document.body.classList.add('is-drawing');

  const pt = getStageCoords(e);

  if (currentDrawTool === 'laser') {
    laserPoints.push({ x: pt.x, y: pt.y, t: performance.now() });
    requestAnimationFrame(updateLaserTrail);
    return;
  }

  currentStroke = {
    tool: currentDrawTool,
    color: currentPenColor,
    size: Number(currentPenSize),
    stageW: cachedStageW,
    points: [pt]
  };

  if (currentDrawTool === 'eraser') {
    renderEraserTailSegment(drawCtx, currentStroke, cachedStageW);
  }
  drawActiveStrokePreview();
});

function handlePointerMove(e) {
  if (!isDrawing || e.pointerId !== activePointerId) return;
  if (e.cancelable) e.preventDefault();

  if (e.pointerType === 'pen') {
    lastPenTimestamp = performance.now();
  }

  if (currentDrawTool === 'laser') {
    const pt = getStageCoords(e);
    laserPoints.push({ x: pt.x, y: pt.y, t: performance.now() });
    requestAnimationFrame(updateLaserTrail);
    return;
  }

  if (!currentStroke) return;

  if (currentDrawTool === 'line' || currentDrawTool === 'rect') {
    currentStroke.points[1] = getStageCoords(e);
    drawActiveStrokePreview();
    return;
  }

  // Use coalesced events on iPad Pro (240Hz Apple Pencil sampling) for ultra-smooth rapid strokes
  const coalesced = (e.getCoalescedEvents && typeof e.getCoalescedEvents === 'function')
    ? e.getCoalescedEvents()
    : null;
  const events = (coalesced && coalesced.length > 0) ? coalesced : [e];
  const pts = currentStroke.points;
  let added = false;

  for (let i = 0; i < events.length; i++) {
    const pt = getStageCoords(events[i]);
    const last = pts[pts.length - 1];
    const dx = pt.x - last.x;
    const dy = pt.y - last.y;
    // Skip sub-pixel noise (< 0.6px) to keep curve control points clean and fast
    if (dx * dx + dy * dy >= 0.36) {
      pts.push(pt);
      added = true;
      if (currentDrawTool === 'eraser') {
        renderEraserTailSegment(drawCtx, currentStroke, cachedStageW);
      }
    }
  }

  if (added) {
    drawActiveStrokePreview();
  }
}

function finishStroke(e) {
  if (!isDrawing) return;
  // Critical: Ignore pointerup/pointercancel from palm or non-active pointers!
  if (e && e.pointerId !== undefined && activePointerId !== null && e.pointerId !== activePointerId) {
    return;
  }
  if (e && e.pointerType === 'pen') {
    lastPenTimestamp = performance.now();
  }

  isDrawing = false;
  activePointerId = null;
  activePointerType = null;
  document.body.classList.remove('is-drawing');

  if (currentDrawTool === 'laser') return;
  if (currentStroke) {
    commitCurrentStrokeImmediate();
  }
}

window.addEventListener('pointermove', handlePointerMove, { passive: false });
window.addEventListener('pointerup', finishStroke, { passive: false });
window.addEventListener('pointercancel', finishStroke, { passive: false });

function togglePalmRejection() {
  SoundFX.click();
  palmRejectionEnabled = !palmRejectionEnabled;
  const btn = document.getElementById('btn-palm-reject');
  const icon = document.getElementById('palm-reject-icon');
  const label = document.getElementById('palm-reject-label');
  if (btn) btn.classList.toggle('active', palmRejectionEnabled);
  if (icon) icon.textContent = palmRejectionEnabled ? '🧤' : '👆';
  if (label) label.textContent = palmRejectionEnabled ? 'กันอุ้งมือ' : 'เขียนด้วยนิ้ว';
}

function updateLaserTrail() {
  const now = performance.now();
  laserPoints = laserPoints.filter(p => now - p.t < 420);

  if (laserDirtyBox) {
    laserCtx.clearRect(
      Math.max(0, Math.floor(laserDirtyBox.minX - 24)),
      Math.max(0, Math.floor(laserDirtyBox.minY - 24)),
      Math.ceil(laserDirtyBox.maxX - laserDirtyBox.minX + 48),
      Math.ceil(laserDirtyBox.maxY - laserDirtyBox.minY + 48)
    );
    laserDirtyBox = null;
  } else {
    laserCtx.clearRect(0, 0, lastCanvasW || laserCanvas.width, lastCanvasH || laserCanvas.height);
  }

  if (laserPoints.length > 0) {
    let minX = laserPoints[0].x, maxX = laserPoints[0].x;
    let minY = laserPoints[0].y, maxY = laserPoints[0].y;
    for (let i = 0; i < laserPoints.length; i++) {
      const p = laserPoints[i];
      if (p.x < minX) minX = p.x;
      if (p.x > maxX) maxX = p.x;
      if (p.y < minY) minY = p.y;
      if (p.y > maxY) maxY = p.y;
    }
    laserDirtyBox = { minX, minY, maxX, maxY };
  }

  if (laserPoints.length > 1) {
    for (let i = 1; i < laserPoints.length; i++) {
      const age = (now - laserPoints[i].t) / 420;
      const alpha = Math.max(0, 1 - age);
      laserCtx.save();
      laserCtx.beginPath();
      laserCtx.moveTo(laserPoints[i - 1].x, laserPoints[i - 1].y);
      laserCtx.lineTo(laserPoints[i].x, laserPoints[i].y);
      laserCtx.strokeStyle = `rgba(248, 113, 113, ${alpha})`;
      laserCtx.lineWidth = 5 * alpha + 2;
      laserCtx.shadowColor = '#ef4444';
      laserCtx.shadowBlur = 12;
      laserCtx.lineCap = 'round';
      laserCtx.stroke();
      laserCtx.restore();
    }
    const last = laserPoints[laserPoints.length - 1];
    laserCtx.save();
    laserCtx.beginPath();
    laserCtx.arc(last.x, last.y, 6, 0, Math.PI * 2);
    laserCtx.fillStyle = '#ffffff';
    laserCtx.shadowColor = '#ef4444';
    laserCtx.shadowBlur = 16;
    laserCtx.fill();
    laserCtx.restore();
  }

  if (isDrawing || laserPoints.length > 0) {
    requestAnimationFrame(updateLaserTrail);
  }
}

function setDrawTool(tool) {
  SoundFX.click();
  currentDrawTool = tool;
  document.querySelectorAll('#pen-toolbar .tool-btn[data-tool]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tool === tool);
  });
  drawCanvas.classList.toggle('pan-mode', tool === 'pan');
}

function setPenColor(color, el) {
  SoundFX.click();
  currentPenColor = color;
  if (currentDrawTool === 'eraser' || currentDrawTool === 'pan' || currentDrawTool === 'laser') {
    setDrawTool('pen');
  }
  document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
  if (el) el.classList.add('active');
}

function setPenSize(val) {
  currentPenSize = Number(val);
  document.getElementById('pen-size-label').textContent = val + 'px';
}

function undoStroke() {
  SoundFX.click();
  const key = getSlideKey();
  if (slideAnnotations[key] && slideAnnotations[key].length > 0) {
    if (!redoStacks[key]) redoStacks[key] = [];
    redoStacks[key].push(slideAnnotations[key].pop());
    renderCurrentSlideStrokes();
    persistAnnotationsToStorage();
  }
}

function redoStroke() {
  SoundFX.click();
  const key = getSlideKey();
  if (redoStacks[key] && redoStacks[key].length > 0) {
    if (!slideAnnotations[key]) slideAnnotations[key] = [];
    slideAnnotations[key].push(redoStacks[key].pop());
    renderCurrentSlideStrokes();
    persistAnnotationsToStorage();
  }
}

function clearCurrentSlideDrawing() {
  const key = getSlideKey();
  if (!slideAnnotations[key] || slideAnnotations[key].length === 0) return;

// LocalStorage / IndexedDB & Per-Account Cloud API Integration (Debounced & Auto-Migrated)
const LESSON_ID = 'english-parts-of-speech';
const STORAGE_KEY = 'english_pos_smartboard_notes_v1';
let currentStorageKey = STORAGE_KEY;
let currentAccountUser = null;
let persistTimer = null;
let cloudSyncTimer = null;
let hasUnsavedAnnotations = false;
let hasPendingCloudSync = false;
let lastSyncedUpdatedAt = null;
let isPullingCloudNotes = false;

function getStrokeFingerprint(s) {
  if (!s || !Array.isArray(s.points) || s.points.length === 0) return '';
  const p0 = s.points[0];
  const pN = s.points[s.points.length - 1];
  return `${s.tool || 'pen'}|${s.color || ''}|${s.size || 3}|${s.points.length}|${Math.round((p0.x || 0) * 2)}|${Math.round((p0.y || 0) * 2)}|${Math.round((pN.x || 0) * 2)}|${Math.round((pN.y || 0) * 2)}`;
}

function mergeSlideStrokes(serverArr, localArr) {
  if (!Array.isArray(serverArr) || serverArr.length === 0) return Array.isArray(localArr) ? localArr : [];
  if (!Array.isArray(localArr) || localArr.length === 0) return serverArr;
  const result = [...serverArr];
  const seen = new Set(serverArr.map(getStrokeFingerprint));
  for (let i = 0; i < localArr.length; i++) {
    const s = localArr[i];
    const fp = getStrokeFingerprint(s);
    if (fp && !seen.has(fp)) {
      seen.add(fp);
      result.push(s);
    }
  }
  return result;
}

function mergeAnnotationsMaps(serverMap, localMap) {
  const sMap = (serverMap && typeof serverMap === 'object') ? serverMap : {};
  const lMap = (localMap && typeof localMap === 'object') ? localMap : {};
  const allKeys = new Set([...Object.keys(sMap), ...Object.keys(lMap)]);
  const merged = {};
  let addedFromLocal = false;
  for (const k of allKeys) {
    const sArr = Array.isArray(sMap[k]) ? sMap[k] : [];
    const lArr = Array.isArray(lMap[k]) ? lMap[k] : [];
    const combined = mergeSlideStrokes(sArr, lArr);
    if (combined.length > sArr.length) {
      addedFromLocal = true;
    }
    if (combined.length > 0) {
      merged[k] = combined;
    }
  }
  return { merged, addedFromLocal };
}

function persistAnnotationsToStorage() {
  if (persistTimer) {
    clearTimeout(persistTimer);
    persistTimer = null;
  }
  hasUnsavedAnnotations = false;
  try {
    localStorage.setItem(currentStorageKey, JSON.stringify(slideAnnotations));
    if (currentStorageKey !== STORAGE_KEY) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(slideAnnotations));
    }
  } catch(e) {}

  // Local-first: do NOT auto-sync on every stroke (prevents lag/stutter while writing).
  // Save locally first; user clicks the Cloud Sync button when finished writing.
  if (currentAccountUser) {
    const dirtyCount = Object.keys(collectDirtySlides()).length;
    hasPendingCloudSync = dirtyCount > 0;
    updateAccountSyncUI(hasPendingCloudSync ? 'pending' : 'saved', hasPendingCloudSync ? '' : 'ซิงก์แล้ว');
  }

  // Trigger custom hook for backend user account integration
  if (typeof window.onSmartboardNotesChanged === 'function') {
    window.onSmartboardNotesChanged(slideAnnotations);
  }
}

function schedulePersistAnnotations() {
  hasUnsavedAnnotations = true;
  if (persistTimer) clearTimeout(persistTimer);
  persistTimer = setTimeout(() => {
    if (isDrawing) {
      schedulePersistAnnotations();

function getSlideSignature(arr) {
  if (!Array.isArray(arr) || arr.length === 0) return '0';
  return arr.length + '|' + getStrokeFingerprint(arr[arr.length - 1]) + '|' + getStrokeFingerprint(arr[0]);
}

// Signatures of what the cloud is known to hold, per slide key
let syncedSigs = {};

function markAllSyncedFrom(map) {
  syncedSigs = {};
  if (map && typeof map === 'object') {
    for (const k of Object.keys(map)) syncedSigs[k] = getSlideSignature(map[k]);
  }
}

function collectDirtySlides() {
  const dirty = {};
  const keys = new Set([...Object.keys(slideAnnotations || {}), ...Object.keys(syncedSigs)]);
  for (const k of keys) {
    const arr = Array.isArray(slideAnnotations[k]) ? slideAnnotations[k] : [];
    if (getSlideSignature(arr) !== (syncedSigs[k] || '0')) dirty[k] = arr;
  }
  return dirty;
}

// Split dirty slides into request-sized batches (<~700KB each) to stay far below server limits
function chunkSlidesForUpload(dirty) {
  const batches = [];
  let cur = {};
  let curSize = 0;
  for (const k of Object.keys(dirty)) {
    const size = JSON.stringify(dirty[k]).length;
    if (Object.keys(cur).length > 0 && curSize + size > 700000) {
      batches.push(cur);
      cur = {};
      curSize = 0;
    }
    cur[k] = dirty[k];
    curSize += size;
  }
  if (Object.keys(cur).length > 0) batches.push(cur);
  return batches;
}

let syncInFlight = false;
let syncAgain = false;

async function syncNotesToAccountNow(manualClick = false) {
  if (!currentAccountUser) return;
  if (cloudSyncTimer) {
    clearTimeout(cloudSyncTimer);
    cloudSyncTimer = null;
  }
  if (syncInFlight) {
    syncAgain = true;
    return;
  }
  syncInFlight = true;
  updateAccountSyncUI('saving');
  let failReason = '';
  try {
    const dirty = collectDirtySlides();
    const batches = chunkSlidesForUpload(dirty);
    for (const batch of batches) {
      const res = await fetch('/api/notes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ lessonId: LESSON_ID, slides: batch })
      });
      const resData = await res.json().catch(() => null);
      if (res.status === 401) {
        failReason = 'เซสชันหมดอายุ — กรุณาเข้าสู่ระบบใหม่';
        break;
      }
      if (!(res.ok && resData && resData.ok)) {
        failReason = 'เซิร์ฟเวอร์ตอบกลับ ' + res.status + ((resData && resData.error) ? ' : ' + resData.error : '');
        break;
      }
      for (const k of Object.keys(batch)) syncedSigs[k] = getSlideSignature(batch[k]);
      if (resData.updatedAt) lastSyncedUpdatedAt = resData.updatedAt;
    }
    if (!failReason) {
      hasPendingCloudSync = false;
      const nowTime = new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
      updateAccountSyncUI('saved', `ซิงก์แล้ว ${nowTime}`);
      if (manualClick && typeof SoundFX !== 'undefined' && SoundFX.chime) {
        SoundFX.chime();
      }
    }
  } catch (err) {
    failReason = 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ (' + (err && err.message ? err.message : 'network') + ')';
  }
  syncInFlight = false;
  if (failReason) {
    console.warn('Cloud sync failed:', failReason);
    updateAccountSyncUI('error', failReason);
    hasPendingCloudSync = true;
  } else if (syncAgain) {
    syncAgain = false;
    syncNotesToAccountNow(false);
  }
}

function flushCloudSyncKeepalive() {
  if (!currentAccountUser) return;
  try {
    const dirty = collectDirtySlides();
    const batches = chunkSlidesForUpload(dirty);
    batches.forEach((batch) => {
      const bodyStr = JSON.stringify({ lessonId: LESSON_ID, slides: batch });
      // WebKit/Chrome reject keepalive:true requests if payload exceeds 64KB
      fetch('/api/notes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: bodyStr,
        keepalive: bodyStr.length < 60000
      }).catch(() => {});
    });
  } catch (e) {}
}

async function pullLatestCloudNotesIfNewer() {
  if (!currentAccountUser || isDrawing || hasUnsavedAnnotations || hasPendingCloudSync || isPullingCloudNotes) return;
  isPullingCloudNotes = true;
  try {
    const ac = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    const tid = ac ? setTimeout(() => ac.abort(), 4000) : null;
    const res = await fetch(`/api/notes?lessonId=${encodeURIComponent(LESSON_ID)}`, {
      method: 'GET',
      cache: 'no-store',
      signal: ac ? ac.signal : undefined
    });
    if (tid) clearTimeout(tid);
    const data = await res.json();
    if (data && data.authenticated && data.annotations && typeof data.annotations === 'object') {
      if (data.updatedAt && data.updatedAt !== lastSyncedUpdatedAt) {
        lastSyncedUpdatedAt = data.updatedAt;
        markAllSyncedFrom(data.annotations);
        const { merged } = mergeAnnotationsMaps(data.annotations, slideAnnotations);
        slideAnnotations = merged;
        try {
          localStorage.setItem(currentStorageKey, JSON.stringify(slideAnnotations));
          localStorage.setItem(STORAGE_KEY, JSON.stringify(slideAnnotations));
        } catch (e) {}
        resizeBoardCanvases(true);
        if (Object.keys(collectDirtySlides()).length > 0) {
          hasPendingCloudSync = true;
          updateAccountSyncUI('pending');
        } else {
          const nowTime = new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
          updateAccountSyncUI('saved', `ซิงก์ล่าสุด ${nowTime}`);
        }
      }
    }
  } catch (e) {
  } finally {
    isPullingCloudNotes = false;
  }
}

async function initAccountAndSmartboardNotes() {
  // 1. Gather all existing local notes from localStorage across legacy & user keys
  let localNotes = {};
  try {
    const rawLegacy = localStorage.getItem(STORAGE_KEY);
    if (rawLegacy) {
      const parsed = JSON.parse(rawLegacy);
      if (parsed && typeof parsed === 'object') {
        localNotes = parsed;
      }
    }
  } catch(e) {}

  try {
    const ac = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    const tid = ac ? setTimeout(() => ac.abort(), 4000) : null;
    const res = await fetch(`/api/notes?lessonId=${encodeURIComponent(LESSON_ID)}`, {
      method: 'GET',
      cache: 'no-store',
      signal: ac ? ac.signal : undefined
    });
    if (tid) clearTimeout(tid);
    const data = await res.json();

    if (data && data.authenticated && data.user) {
      currentAccountUser = data.user;
      if (data.updatedAt) lastSyncedUpdatedAt = data.updatedAt;
      const cleanId = String(data.user.id || data.user.name || 'user').trim().toLowerCase();
      currentStorageKey = `english_pos_smartboard_notes_v1_user_${cleanId}`;

      // Check if user has notes under their own key on this browser
      try {
        const rawUser = localStorage.getItem(currentStorageKey);
        if (rawUser) {
          const parsedUser = JSON.parse(rawUser);
          if (parsedUser && typeof parsedUser === 'object') {
            const { merged } = mergeAnnotationsMaps(localNotes, parsedUser);
            localNotes = merged;
          }
        }
      } catch(e) {}

      const serverNotes = data.annotations;
      const hasServerNotes = serverNotes && typeof serverNotes === 'object' && Object.keys(serverNotes).length > 0;
      const hasLocalNotes = localNotes && typeof localNotes === 'object' && Object.keys(localNotes).length > 0;

      if (hasLocalNotes && !hasServerNotes) {
        syncedSigs = {};
        slideAnnotations = localNotes;
        hasPendingCloudSync = true;
        updateAccountSyncUI('pending');
      } else if (hasLocalNotes && hasServerNotes) {
        // [SMART PER-STROKE MERGE] Both exist: combine every unique stroke across all slides so nothing is ever lost!
        markAllSyncedFrom(serverNotes);
        const { merged } = mergeAnnotationsMaps(serverNotes, localNotes);
        slideAnnotations = merged;
        if (Object.keys(collectDirtySlides()).length > 0) {
          hasPendingCloudSync = true;
          updateAccountSyncUI('pending');
        } else {
          updateAccountSyncUI('saved', 'ซิงก์คลาวด์แล้ว');
        }
      } else if (hasServerNotes) {
        // [CLOUD LOAD] Fresh device/PC: load user's strokes from Cloud DB!
        markAllSyncedFrom(serverNotes);
        slideAnnotations = serverNotes;
        updateAccountSyncUI('saved', 'ซิงก์คลาวด์แล้ว');
      } else {
        syncedSigs = {};
        slideAnnotations = {};
        updateAccountSyncUI('saved', 'ซิงก์คลาวด์แล้ว');
      }

      // Save merged/latest notes to local storage
      try {
        localStorage.setItem(currentStorageKey, JSON.stringify(slideAnnotations));
        localStorage.setItem(STORAGE_KEY, JSON.stringify(slideAnnotations));
      } catch(e) {}

      resizeBoardCanvases(true);
    } else {
      // Guest mode
      currentAccountUser = null;
      currentStorageKey = STORAGE_KEY;
      loadAnnotationsFromStorage();
      resizeBoardCanvases(true);
      updateAccountSyncUI('guest');
    }
  } catch (err) {
    console.warn('Init account notes network warning:', err);
    currentAccountUser = null;
    currentStorageKey = STORAGE_KEY;
    loadAnnotationsFromStorage();
    resizeBoardCanvases(true);
    updateAccountSyncUI('guest');
  }
}

(function attachBoardPinchGesture() {
  const vp = document.getElementById('board-viewport');
  if (!vp) return;
  let pinchStartDist = 0;
  let pinchStartZoom = 1;
  let lastMidX = 0;
  let lastMidY = 0;

  vp.addEventListener('touchstart', (e) => {
    if (e.touches && e.touches.length === 2) {
      if (isDrawing && activePointerType === 'touch') {
        clearActiveDirtyBox();
        currentStroke = null;
        isDrawing = false;
        activePointerId = null;
        document.body.classList.remove('is-drawing');
      }
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      pinchStartDist = Math.hypot(dx, dy) || 1;
      pinchStartZoom = boardZoom;
      lastMidX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      lastMidY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    }
  }, { capture: true, passive: true });

  vp.addEventListener('touchmove', (e) => {
    if (e.touches && e.touches.length === 2 && pinchStartDist > 0) {
      if (e.cancelable) e.preventDefault();
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const curDist = Math.hypot(dx, dy) || pinchStartDist;
      const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      vp.scrollLeft -= (midX - lastMidX);
      vp.scrollTop -= (midY - lastMidY);
      lastMidX = midX;
      lastMidY = midY;
      setBoardZoom(pinchStartZoom * (curDist / pinchStartDist), midX, midY);
    }
  }, { capture: true, passive: false });

  vp.addEventListener('touchend', (e) => {
    if (!e.touches || e.touches.length < 2) {
      pinchStartDist = 0;
    }
  }, { capture: true, passive: true });
})();

      </div>
    `
  },
  {

    group: '8. เฉลยแบบฝึกหัด & ข้อสอบท้ายบท',
    title: 'เฉลยข้อสอบแข่งขันท้ายบท 20 ข้อ (TOEIC / A-Level)',
    badge: 'เฉลยท้ายบท',
    html: `

        <span class="slide-subtitle-badge">ตรวจคำตอบหลังทำครบ 20 ข้อ</span>

      <div class="sb-card">

          <tr><td><b>ข้อ 1</b></td><td style='color:var(--accent-green); font-weight:700;'>C</td><td>หลังคำนาม 'Customer' ที่ทำหน้าที่ขยายนาม (Compound Noun) และหน้ากริยา 'is' ต้องใช้ Noun = satisfaction</td></tr>
<tr><td><b>ข้อ 2</b></td><td style='color:var(--accent-green); font-weight:700;'>C</td><td>วางหน้า Adjective 'clear' เพื่อขยายความระดับความชัดเจน ต้องใช้ Adverb = remarkably</td></tr>

<tr><td><b>ข้อ 7</b></td><td style='color:var(--accent-green); font-weight:700;'>C</td><td>อยู่หลัง Article + Adjective ('the immediate ____') และหน้า 'of' ต้องใช้ Noun = adoption</td></tr>

// ====================================================
// 3. SLIDE NAVIGATION, CONSOLIDATED SIDEBAR & QUESTION BAR
// ====================================================
function isQuizSlide(s) {
  return s && (s.id.startsWith('q') || s.id.startsWith('ex'));
}

function isRealExamSlide(s) {
  return s && s.id.startsWith('ex');
}

function getDeckForSlideIndex(idx) {
  const cur = SLIDES[idx];
  if (!cur || !isQuizSlide(cur)) return [];
  if (isRealExamSlide(cur)) {
    return SLIDES.map((s, i) => ({ slide: s, idx: i })).filter(x => isRealExamSlide(x.slide));
  }
  // Exercise deck for the same topic group
  return SLIDES.map((s, i) => ({ slide: s, idx: i })).filter(x => x.slide.group === cur.group && x.slide.id.startsWith('q'));
}

function buildSidebarTOC(filterText = '') {
  const tocContainer = document.getElementById('toc-list');
  tocContainer.innerHTML = '';
  const q = filterText.trim().toLowerCase();

  // Group slides by s.group
  const groups = [];
  const groupMap = {};
  SLIDES.forEach((s, idx) => {
    if (q && !s.title.toLowerCase().includes(q) && !s.group.toLowerCase().includes(q) && !String(idx + 1).includes(q)) {
      return;
    }
    if (!groupMap[s.group]) {
      groupMap[s.group] = { name: s.group, items: [] };
      groups.push(groupMap[s.group]);
    }
    groupMap[s.group].items.push({ slide: s, idx });
  });

  groups.forEach(g => {
    const groupDiv = document.createElement('div');
    groupDiv.className = 'toc-group';

    // Separate theory slides vs exercise/exam slides when not searching
    const theoryItems = g.items.filter(x => !isQuizSlide(x.slide));
    const quizItems = g.items.filter(x => isQuizSlide(x.slide));
    const isExamGroup = g.name.startsWith('7.');

    // If this is Group 10 (Real Exam Bank) and no search filter is active, render as ONE single prominent bar!
    if (isExamGroup && !q && quizItems.length > 0) {
      const isCurrentInExam = quizItems.some(x => x.idx === currentSlideIndex);
      const targetIdx = isCurrentInExam ? currentSlideIndex : quizItems[0].idx;
      const activePos = isCurrentInExam ? (quizItems.findIndex(x => x.idx === currentSlideIndex) + 1) : 1;

      const singleExamBar = document.createElement('div');
      singleExamBar.className = 'toc-deck-item' + (isCurrentInExam ? ' active' : '');
      singleExamBar.innerHTML = `
        <div style="display:flex; flex-direction:column; gap:2px; overflow:hidden;">
          <span style="font-size:13.5px; font-weight:700;">🏆 7. ข้อสอบแข่งขันท้ายบท (20 ข้อ)</span>
          <span style="font-size:11px; opacity:0.85;">เลือกทำทีละข้อ (${ isCurrentInExam ? 'กำลังอยู่ที่ข้อ ' + activePos + '/' + quizItems.length : 'รวมทั้งหมด ' + quizItems.length + ' ข้อ' })</span>
        </div>
        <span class="badge-page" style="background:rgba(0,0,0,0.25); color:inherit;">${quizItems.length} ข้อ ▶</span>
      `;
      singleExamBar.onclick = () => {
        SoundFX.click();
        goToSlide(targetIdx);
      };
      tocContainer.appendChild(singleExamBar);
      return;
    }

    const header = document.createElement('div');
    header.className = 'toc-group-header';
    const summaryLabel = quizItems.length > 0 && !q
      ? `${theoryItems.length} เนื้อหา + ${quizItems.length} โจทย์ ▾`
      : `${g.items.length} หน้า ▾`;
    header.innerHTML = `<span>${g.name}</span><span style="font-size:11px; color:var(--text-muted);">${summaryLabel}</span>`;
    header.onclick = () => groupDiv.classList.toggle('closed');
    groupDiv.appendChild(header);

    const itemsBox = document.createElement('div');
    itemsBox.className = 'toc-group-items';

    // If searching, show matching items directly
    const itemsToRender = q ? g.items : theoryItems;

    itemsToRender.forEach(({ slide, idx }) => {
      const item = document.createElement('div');
      item.className = 'toc-item' + (idx === currentSlideIndex ? ' active' : '');
      item.id = 'toc-item-' + idx;

      let badgesHtml = '';
      if (slide.lab3d) badgesHtml += `<span class="badge-3d" title="มีห้องแล็บ 3D">3D</span>`;
      if (slide.anim) badgesHtml += `<span class="badge-anim" title="มี Animation Graphic">Anim</span>`;
      if (isQuizSlide(slide)) badgesHtml += `<span class="badge-quiz">โจทย์</span>`;
      badgesHtml += `<span class="badge-page">น.${idx + 1}</span>`;

      item.innerHTML = `
        <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${slide.title}</span>
        <div class="toc-item-badges">${badgesHtml}</div>
      `;
      item.onclick = () => {
        SoundFX.click();
        goToSlide(idx);
      };
      itemsBox.appendChild(item);
    });

    // Collapse topic's exercises into a single clean bar at the bottom of that topic group
    if (!q && quizItems.length > 0) {
      const isCurrentInTopicQuiz = quizItems.some(x => x.idx === currentSlideIndex);
      const targetQuizIdx = isCurrentInTopicQuiz ? currentSlideIndex : quizItems[0].idx;
      const curQuizNum = isCurrentInTopicQuiz ? (quizItems.findIndex(x => x.idx === currentSlideIndex) + 1) : 1;

      const quizDeckBtn = document.createElement('div');
      quizDeckBtn.className = 'toc-deck-item' + (isCurrentInTopicQuiz ? ' active' : '');
      quizDeckBtn.innerHTML = `
        <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
          📝 แบบฝึกหัดท้ายหัวข้อ (${isCurrentInTopicQuiz ? 'ข้อที่ ' + curQuizNum + '/' + quizItems.length : 'รวม ' + quizItems.length + ' ข้อ'})
        </span>
        <span class="badge-page" style="background:rgba(0,0,0,0.2); color:inherit;">ทีละข้อ ▶</span>
      `;
      quizDeckBtn.onclick = () => {
        SoundFX.click();
        goToSlide(targetQuizIdx);
      };
      itemsBox.appendChild(quizDeckBtn);
    }

    groupDiv.appendChild(itemsBox);
    tocContainer.appendChild(groupDiv);
  });
}

function filterTOC(val) {
  buildSidebarTOC(val);
}

function updateQuestionNavBar(idx) {
  const bar = document.getElementById('question-nav-bar');
  const slide = SLIDES[idx];
  if (!bar || !slide || !isQuizSlide(slide)) {
    if (bar) bar.classList.remove('show');
    return;
  }

  bar.classList.add('show');
  const deck = getDeckForSlideIndex(idx);
  const pos = deck.findIndex(x => x.idx === idx);

  const badgeEl = document.getElementById('qnav-deck-badge');
  const counterEl = document.getElementById('qnav-counter');
  const selectEl = document.getElementById('qnav-select');
  const prevBtn = document.getElementById('qnav-prev-btn');
  const nextBtn = document.getElementById('qnav-next-btn');

  if (isRealExamSlide(slide)) {
    badgeEl.textContent = '🏆 ข้อสอบแข่งขันท้ายบท (TOEIC / A-Level / TGAT)';
  } else {
    badgeEl.textContent = `📝 แบบฝึกหัด : ${slide.group}`;
  }

  counterEl.textContent = `ข้อที่ ${pos + 1} / ${deck.length}`;

  selectEl.innerHTML = '';
  deck.forEach((item, i) => {
    const opt = document.createElement('option');
    opt.value = item.idx;
    opt.textContent = `[ข้อที่ ${i + 1}/${deck.length}] ${item.slide.title}`;
    if (item.idx === idx) opt.selected = true;
    selectEl.appendChild(opt);
  });

  prevBtn.disabled = pos <= 0;
  nextBtn.disabled = pos >= deck.length - 1;
}

function prevQuestionInDeck() {
  const deck = getDeckForSlideIndex(currentSlideIndex);
  const pos = deck.findIndex(x => x.idx === currentSlideIndex);
  if (pos > 0) {
    SoundFX.click();
    goToSlide(deck[pos - 1].idx);
  }
}

function nextQuestionInDeck() {
  const deck = getDeckForSlideIndex(currentSlideIndex);
  const pos = deck.findIndex(x => x.idx === currentSlideIndex);
  if (pos >= 0 && pos < deck.length - 1) {
    SoundFX.click();
    goToSlide(deck[pos + 1].idx);
  }
}

function firstQuestionInDeck() {
  const deck = getDeckForSlideIndex(currentSlideIndex);
  if (deck.length > 0) {
    SoundFX.click();
    goToSlide(deck[0].idx);
  }
}

function randomQuestionInDeck() {
  const deck = getDeckForSlideIndex(currentSlideIndex);
  if (deck.length > 1) {
    SoundFX.chime();
    let r = Math.floor(Math.random() * deck.length);
    if (deck[r].idx === currentSlideIndex) r = (r + 1) % deck.length;
    goToSlide(deck[r].idx);
  }
}

function goToSlide(idx) {
  if (idx < 0 || idx >= SLIDES.length) return;
  if (isDrawing && currentStroke) {
    finishStroke();
  }
  currentSlideIndex = idx;
  const slide = SLIDES[idx];

  document.getElementById('slide-content-layer').innerHTML = slide.html;
  document.getElementById('page-indicator').textContent = `หน้า ${idx + 1} / ${SLIDES.length}`;
  document.getElementById('current-section-badge').textContent = `${slide.group} • ${slide.badge || ''}`;
  try { history.replaceState(null, '', '#page=' + (idx + 1)); } catch(e) {}

  // Show/hide small feature buttons on topbar
  const btn3d = document.getElementById('btn-open-3d');
  const btnAnim = document.getElementById('btn-open-anim');
  // Clean topbar without Chemistry modal buttons

  // Update Single Question Navigation Bar
  updateQuestionNavBar(idx);
  if (typeof schedulePinFloatingUI === 'function') schedulePinFloatingUI();

  // Rebuild TOC so active deck counters & highlights stay in sync
  const searchVal = document.getElementById('toc-search-input') ? document.getElementById('toc-search-input').value : '';
  buildSidebarTOC(searchVal);

  const sidebarEl = document.getElementById('sidebar');
  const tocListEl = document.getElementById('toc-list');
  const activeItem = document.querySelector('#toc-list .toc-item.active, #toc-list .toc-deck-item.active');
  if (activeItem && tocListEl && sidebarEl && !sidebarEl.classList.contains('collapsed')) {
    const itemTop = activeItem.offsetTop;
    const itemBottom = itemTop + activeItem.offsetHeight;
    const viewTop = tocListEl.scrollTop;
    const viewBottom = viewTop + tocListEl.clientHeight;
    if (itemTop < viewTop || itemBottom > viewBottom) {
      tocListEl.scrollTop = Math.max(0, itemTop - tocListEl.clientHeight / 2);
    }
  }

  document.getElementById('board-viewport').scrollTop = 0;
  resizeBoardCanvases(true);
  setTimeout(() => resizeBoardCanvases(true), 30);
}

function prevSlide() {
  if (currentSlideIndex > 0) {
    SoundFX.click();
    goToSlide(currentSlideIndex - 1);
  }
}

function nextSlide() {
  if (currentSlideIndex < SLIDES.length - 1) {
    SoundFX.click();
    goToSlide(currentSlideIndex + 1);
  }
}

function promptJumpPage() {
  const input = prompt(`ระบุหมายเลขหน้าที่ต้องการไป (1 - ${SLIDES.length}):`, currentSlideIndex + 1);
  if (input) {
    const p = parseInt(input, 10);
    if (!isNaN(p) && p >= 1 && p <= SLIDES.length) {
      goToSlide(p - 1);
    }
  }
}

function toggleSidebar() {
  SoundFX.click();
  document.getElementById('sidebar').classList.toggle('collapsed');
  setTimeout(resizeBoardCanvases, 300);
}

function toggleTheme() {
  SoundFX.click();
  document.body.classList.toggle('light-board');
  const isLight = document.body.classList.contains('light-board');
  document.getElementById('btn-theme').textContent = isLight ? '☀️ กระดานขาว' : '🌙 กระดานดำ';
  if (isLight && currentPenColor === '#ffffff') {
    currentPenColor = '#0f172a';
  } else if (!isLight && currentPenColor === '#0f172a') {
    currentPenColor = '#ffffff';
  }
}

function toggleFullScreen() {
  SoundFX.click();
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen().catch(() => {});
  }
}

window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;

  if (e.key === 'ArrowRight' || e.key === 'PageDown') nextSlide();
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') prevSlide();
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undoStroke(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); redoStroke(); }
  else if (e.key.toLowerCase() === 'm') { toggleSidebar(); }
});



window.addEventListener('DOMContentLoaded', () => {
  loadAnnotationsFromStorage();
  buildSidebarTOC();
  let startIdx = 0;
  const initialHash = window.location.hash || '';
  const initialSearch = window.location.search || '';
  try {
    const m = initialHash.match(/page=(\d+)/);
    if (m) {
      const p = parseInt(m[1], 10) - 1;
      if (p >= 0 && p < SLIDES.length) startIdx = p;
    }
    const params = new URLSearchParams(initialSearch);
    const qp = params.get('page');
    if (qp) {
      const p = parseInt(qp, 10) - 1;
      if (p >= 0 && p < SLIDES.length) startIdx = p;
    }
  } catch(e) {}
  goToSlide(startIdx);
  initAccountAndSmartboardNotes();
  pinFloatingUIOnZoom();
});
</script>
