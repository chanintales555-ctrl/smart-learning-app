<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>กระดานอัจฉริยะ เคมี ม.5 : กรด - เบส (Interactive Smartboard & 3D Lab)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root {
  --bg-board: #14171c;
  --grid-line: rgba(255, 255, 255, 0.055);
  --grid-major: rgba(255, 255, 255, 0.10);
  --panel-bg: #1b1f27;
  --panel-border: #2d3545;
  --text-main: #f1f5f9;
  --text-muted: #94a3b8;
  --accent-orange: #fb923c;
  --accent-yellow: #facc15;
  --accent-green: #4ade80;
  --accent-cyan: #38bdf8;
  --accent-pink: #f472b6;
  --accent-purple: #c084fc;
  --accent-red: #f87171;
  --table-border: #cbd5e1;
  --card-bg: rgba(30, 41, 59, 0.55);
}

body.light-board {
  --bg-board: #f8fafc;
  --grid-line: rgba(15, 23, 42, 0.06);
  --grid-major: rgba(15, 23, 42, 0.12);
  --panel-bg: #ffffff;
  --panel-border: #cbd5e1;
  --text-main: #0f172a;
  --text-muted: #475569;
  --accent-orange: #ea580c;
  --accent-yellow: #ca8a04;
  --accent-green: #16a34a;
  --accent-cyan: #0284c7;
  --accent-pink: #db2777;
  --accent-purple: #7e22ce;
  --accent-red: #dc2626;
  --table-border: #334155;
  --card-bg: rgba(241, 245, 249, 0.75);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
  -webkit-user-select: none;
}

html, body {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background-color: var(--bg-board);
  color: var(--text-main);
  font-family: 'Prompt', 'Sarabun', sans-serif;
}

/* Main App Container */
#app {
  display: flex;
  width: 100vw;
  height: 100vh;
  position: relative;
}

/* Left Sidebar: Table of Contents */
#sidebar {
  width: 310px;
  min-width: 310px;
  height: 100vh;
  background: var(--panel-bg);
  border-right: 1px solid var(--panel-border);
  display: flex;
  flex-direction: column;
  z-index: 50;
  transition: margin-left 0.28s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 4px 0 20px rgba(0,0,0,0.35);
}

#sidebar.collapsed {
  margin-left: -310px;
}

.sidebar-header {
  padding: 14px 16px;
  border-bottom: 1px solid var(--panel-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: linear-gradient(135deg, rgba(251,146,60,0.15), rgba(56,189,248,0.1));
}

.sidebar-brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.sidebar-brand-icon {
  width: 34px;
  height: 34px;
  border-radius: 9px;
  background: linear-gradient(135deg, #f97316, #ec4899);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  color: #fff;
  font-size: 16px;
  box-shadow: 0 2px 8px rgba(249,115,22,0.4);
}

.sidebar-brand-text h1 {
  font-size: 15px;
  font-weight: 700;
  color: var(--text-main);
  line-height: 1.2;
}

.sidebar-brand-text span {
  font-size: 11px;
  color: var(--text-muted);
}

.sidebar-search {
  padding: 10px 12px;
  border-bottom: 1px solid var(--panel-border);
}

.sidebar-search input {
  width: 100%;
  padding: 7px 12px;
  border-radius: 8px;
  border: 1px solid var(--panel-border);
  background: rgba(0,0,0,0.2);
  color: var(--text-main);
  font-family: inherit;
  font-size: 13px;
  outline: none;
}

body.light-board .sidebar-search input {
  background: #f1f5f9;
}

.sidebar-search input:focus {
  border-color: var(--accent-cyan);
}

#toc-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px 8px 24px 8px;
}

#toc-list::-webkit-scrollbar {
  width: 6px;
}
#toc-list::-webkit-scrollbar-thumb {
  background: rgba(148,163,184,0.3);
  border-radius: 3px;
}

.toc-group {
  margin-bottom: 8px;
  border-radius: 9px;
  overflow: hidden;
  border: 1px solid rgba(148,163,184,0.12);
  background: rgba(255,255,255,0.015);
}

.toc-group-header {
  padding: 9px 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(255,255,255,0.03);
  transition: background 0.15s;
}

.toc-group-header:hover {
  background: rgba(56,189,248,0.12);
}

.toc-group-items {
  display: flex;
  flex-direction: column;
  padding: 4px;
}

.toc-group.closed .toc-group-items {
  display: none;
}

.toc-item {
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 12.5px;
  color: var(--text-muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  transition: all 0.15s;
}

.toc-item:hover {
  background: rgba(255,255,255,0.06);
  color: var(--text-main);
}

.toc-item.active {
  background: rgba(56,189,248,0.18);
  color: var(--accent-cyan);
  font-weight: 600;
  border-left: 3px solid var(--accent-cyan);
}

.toc-item-badges {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}

.badge-page {
  font-size: 10.5px;
  padding: 1px 6px;
  border-radius: 4px;
  background: rgba(148,163,184,0.15);
  color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace;
}

.toc-item.active .badge-page {
  background: var(--accent-cyan);
  color: #0f172a;
  font-weight: 700;
}

.badge-3d {
  font-size: 9.5px;
  padding: 1px 4px;
  border-radius: 4px;
  background: rgba(244,114,182,0.2);
  color: #f472b6;
  border: 1px solid rgba(244,114,182,0.4);
}

.badge-anim {
  font-size: 9.5px;
  padding: 1px 4px;
  border-radius: 4px;
  background: rgba(74,222,128,0.2);
  color: #4ade80;
  border: 1px solid rgba(74,222,128,0.4);
}

.badge-quiz {
  font-size: 9.5px;
  padding: 1px 4px;
  border-radius: 4px;
  background: rgba(250,204,21,0.2);
  color: #facc15;
}

/* Main Workspace Area */
#main-area {
  flex: 1;
  height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}

/* Top Bar */
#topbar {
  height: 52px;
  min-height: 52px;
  background: var(--panel-bg);
  border-bottom: 1px solid var(--panel-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  z-index: 40;
}

.topbar-left, .topbar-center, .topbar-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

.icon-btn {
  height: 34px;
  padding: 0 11px;
  border-radius: 8px;
  border: 1px solid var(--panel-border);
  background: rgba(255,255,255,0.04);
  color: var(--text-main);
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s;
}

.icon-btn:hover {
  background: rgba(56,189,248,0.15);
  border-color: var(--accent-cyan);
}

.icon-btn.primary {
  background: linear-gradient(135deg, #0284c7, #2563eb);
  border-color: #38bdf8;
  color: #fff;
}

.slide-nav-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(0,0,0,0.25);
  padding: 3px 8px;
  border-radius: 10px;
  border: 1px solid var(--panel-border);
}

body.light-board .slide-nav-pill {
  background: #f1f5f9;
}

#page-indicator {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 600;
  min-width: 90px;
  text-align: center;
  cursor: pointer;
}

/* Interactive Feature Launch Buttons (Small buttons on top bar / slide corner) */
#feature-buttons-container {
  display: flex;
  align-items: center;
  gap: 8px;
}

.feature-trigger-btn {
  height: 34px;
  padding: 0 12px;
  border-radius: 18px;
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  display: none;
  align-items: center;
  gap: 6px;
  transition: transform 0.15s, box-shadow 0.15s;
  animation: pulseSubtle 2.5s infinite;
}

.feature-trigger-btn.show {
  display: inline-flex;
}

.feature-trigger-btn.btn-3d {
  background: linear-gradient(135deg, #db2777, #9333ea);
  color: #fff;
  border: 1px solid #f472b6;
  box-shadow: 0 0 14px rgba(244, 114, 182, 0.45);
}

.feature-trigger-btn.btn-anim {
  background: linear-gradient(135deg, #059669, #0284c7);
  color: #fff;
  border: 1px solid #4ade80;
  box-shadow: 0 0 14px rgba(74, 222, 128, 0.4);
}

.feature-trigger-btn:hover {
  transform: scale(1.04);
}

@keyframes pulseSubtle {
  0%, 100% { filter: brightness(1); }
  50% { filter: brightness(1.18); }
}

/* Smartboard Viewport */
#board-viewport {
  flex: 1;
  width: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  position: relative;
  background-color: var(--bg-board);
  background-image:
    linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px),
    linear-gradient(to right, var(--grid-major) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid-major) 1px, transparent 1px);
  background-size: 28px 28px, 28px 28px, 140px 140px, 140px 140px;
}

#board-stage {
  position: relative;
  width: 100%;
  min-height: 1180px;
  padding: 28px 44px 120px 44px;
}

/* Content Layer (Teacher's Slide Structure: Headings + Illustrations + Empty Frameworks) */
#slide-content-layer {
  position: relative;
  z-index: 10;
  width: 100%;
  max-width: 1520px;
  margin: 0 auto;
  pointer-events: none; /* Let pen strokes pass through unless interactive element */
}

#slide-content-layer .interactive-el {
  pointer-events: auto;
}

/* Drawing Canvas Layer */
#drawing-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 20;
  touch-action: none;
  cursor: crosshair;
}

#drawing-canvas.pan-mode {
  pointer-events: none;
}

/* Laser Pointer Trail Canvas */
#laser-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 25;
  pointer-events: none;
}

/* Handwritten-style / Smartboard Slide Typography & Components */
.slide-header-box {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 22px;
  padding-bottom: 12px;
  border-bottom: 2px dashed rgba(251, 146, 60, 0.45);
}

.slide-main-title {
  font-size: 32px;
  font-weight: 700;
  color: var(--accent-orange);
  letter-spacing: 0.3px;
  display: flex;
  align-items: center;
  gap: 14px;
  text-shadow: 0 2px 12px rgba(251, 146, 60, 0.2);
}

.slide-num-circle {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 2.5px solid var(--accent-pink);
  color: var(--accent-pink);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: 700;
  flex-shrink: 0;
}

.slide-subtitle-badge {
  font-size: 16px;
  font-weight: 600;
  padding: 5px 14px;
  border-radius: 20px;
  background: rgba(56, 189, 248, 0.12);
  border: 1.5px solid var(--accent-cyan);
  color: var(--accent-cyan);
}

/* Smartboard Tables (matching overview.pdf yellow/white clean lines with large blank writing cells) */
.sb-table {
  width: 100%;
  border-collapse: collapse;
  margin: 14px 0 24px 0;
  border: 2px solid var(--accent-yellow);
}

.sb-table th, .sb-table td {
  border: 1.5px solid rgba(250, 204, 21, 0.65);
  padding: 14px 18px;
  vertical-align: top;
}

body.light-board .sb-table,
body.light-board .sb-table th,
body.light-board .sb-table td {
  border-color: #475569;
}

.sb-table th {
  font-size: 21px;
  font-weight: 600;
  color: var(--accent-yellow);
  background: rgba(250, 204, 21, 0.06);
  text-align: center;
}

.sb-table td.row-label {
  font-size: 19px;
  font-weight: 600;
  color: var(--accent-cyan);
  width: 200px;
  text-align: center;
  vertical-align: middle;
  background: rgba(56, 189, 248, 0.05);
}

.sb-write-space {
  min-height: 150px;
  position: relative;
}

.sb-write-space-lg {
  min-height: 280px;
  position: relative;
}

.sb-write-space-xl {
  min-height: 520px;
  position: relative;
}

/* Smartboard Layout Grids */
.sb-grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 28px;
  margin-bottom: 24px;
}

.sb-grid-3 {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 22px;
  margin-bottom: 24px;
}

.sb-card {
  border: 2px solid rgba(148, 163, 184, 0.35);
  border-radius: 14px;
  padding: 18px 22px;
  background: rgba(15, 23, 42, 0.28);
  position: relative;
}

body.light-board .sb-card {
  background: rgba(255, 255, 255, 0.55);
  border-color: #94a3b8;
}

.sb-card-title {
  font-size: 22px;
  font-weight: 700;
  color: var(--accent-green);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.sb-branch-list {
  display: flex;
  flex-direction: column;
  gap: 26px;
  padding-left: 18px;
  border-left: 3px solid var(--accent-yellow);
  margin: 14px 0 22px 12px;
}

.sb-branch-item {
  position: relative;
  padding-left: 24px;
  font-size: 21px;
  font-weight: 600;
  color: var(--text-main);
}

.sb-branch-item::before {
  content: "";
  position: absolute;
  left: -18px;
  top: 15px;
  width: 30px;
  height: 2.5px;
  background: var(--accent-yellow);
}

.sb-blank-line {
  display: inline-block;
  border-bottom: 2px dotted rgba(148, 163, 184, 0.55);
  min-width: 220px;
  height: 30px;
  vertical-align: bottom;
  margin: 0 6px;
}

/* Exercise & Real Exam Boxes */
.quiz-problem-box {
  border: 2px solid var(--accent-cyan);
  border-radius: 14px;
  padding: 20px 26px;
  background: rgba(15, 23, 42, 0.5);
  margin-bottom: 22px;
}

body.light-board .quiz-problem-box {
  background: rgba(241, 245, 249, 0.85);
}

.quiz-question-text {
  font-size: 22px;
  font-weight: 600;
  line-height: 1.55;
  color: var(--text-main);
  margin-bottom: 14px;
}

.quiz-choices-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px 28px;
  margin-top: 12px;
  font-size: 20px;
  color: var(--accent-yellow);
}

.quiz-work-header {
  font-size: 19px;
  font-weight: 700;
  color: var(--accent-green);
  text-decoration: underline;
  margin-bottom: 10px;
}

/* Floating Bottom Pen & Annotation Toolbar */
#pen-toolbar {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(27, 31, 39, 0.95);
  backdrop-filter: blur(12px);
  border: 1px solid var(--panel-border);
  border-radius: 20px;
  padding: 7px 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  z-index: 60;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
}

body.light-board #pen-toolbar {
  background: rgba(255, 255, 255, 0.95);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
}

.tool-btn {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-main);
  font-size: 17px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}

.tool-btn:hover {
  background: rgba(255,255,255,0.08);
}

.tool-btn.active {
  background: rgba(56, 189, 248, 0.22);
  border-color: var(--accent-cyan);
  color: var(--accent-cyan);
  transform: translateY(-2px);
}

.tool-divider {
  width: 1px;
  height: 26px;
  background: var(--panel-border);
  margin: 0 2px;
}

.color-swatch {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
  transition: transform 0.15s;
}

.color-swatch.active {
  transform: scale(1.25);
  border-color: #fff;
  box-shadow: 0 0 8px currentColor;
}

.size-slider {
  width: 72px;
  accent-color: var(--accent-cyan);
  cursor: pointer;
}

/* Fullscreen Modal Overlay for 3D Labs & Animation Graphics */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10, 12, 16, 0.96);
  z-index: 200;
  display: none;
  flex-direction: column;
}

.modal-overlay.open {
  display: flex;
}

.modal-header {
  height: 58px;
  padding: 0 24px;
  background: #161922;
  border-bottom: 1px solid #2d3545;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.modal-title {
  font-size: 19px;
  font-weight: 700;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 12px;
}

.modal-body {
  flex: 1;
  display: flex;
  position: relative;
  overflow: hidden;
}

.lab-stage {
  flex: 1;
  position: relative;
  height: 100%;
  background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
}

.lab-controls {
  width: 360px;
  background: #161922;
  border-left: 1px solid #2d3545;
  padding: 20px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
  color: #f1f5f9;
}

.lab-control-card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  padding: 14px;
}

.lab-control-card h4 {
  font-size: 14px;
  color: #38bdf8;
  margin-bottom: 10px;
}

.lab-btn {
  width: 100%;
  padding: 10px 14px;
  border-radius: 9px;
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.07);
  color: #fff;
  font-family: inherit;
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  margin-bottom: 8px;
  transition: all 0.15s;
}

.lab-btn:hover {
  background: rgba(56,189,248,0.25);
  border-color: #38bdf8;
}

.lab-btn.active {
  background: linear-gradient(135deg, #0284c7, #2563eb);
  border-color: #38bdf8;
}

/* Single Question Navigation Bar (for Exercises & Real Exam Deck) */
#question-nav-bar {
  display: none;
  min-height: 48px;
  background: linear-gradient(90deg, rgba(15, 23, 42, 0.96), rgba(30, 41, 59, 0.96));
  border-bottom: 2px solid var(--accent-yellow);
  padding: 6px 18px;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  z-index: 38;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
}

body.light-board #question-nav-bar {
  background: linear-gradient(90deg, #fefce8, #f0f9ff);
  border-bottom: 2px solid #ca8a04;
}

#question-nav-bar.show {
  display: flex;
}

.qnav-left, .qnav-center, .qnav-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.qnav-deck-badge {
  font-size: 13.5px;
  font-weight: 700;
  color: #0f172a;
  background: linear-gradient(135deg, #facc15, #fb923c);
  padding: 4px 12px;
  border-radius: 16px;
  white-space: nowrap;
}

.qnav-counter {
  font-size: 14px;
  font-weight: 700;
  color: var(--accent-cyan);
  font-family: 'JetBrains Mono', monospace;
  white-space: nowrap;
}

.qnav-btn {
  height: 34px;
  padding: 0 14px;
  border-radius: 8px;

<script>
// ==========================================
// 1. WEB AUDIO SYNTHESIZER (SOUND EFFECTS)
// ==========================================
const SoundFX = {
  ctx: null,
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  },
  click() {
    try {
      this.init();
      if (!this.ctx) return;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(620, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(220, this.ctx.currentTime + 0.045);
      gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.045);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.05);
    } catch(e) {}
  },
  drop() {
    try {
      this.init();
      if (!this.ctx) return;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(320, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(980, this.ctx.currentTime + 0.09);
      gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.1);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.1);
    } catch(e) {}
  },
  fizz() {
    try {
      this.init();
      if (!this.ctx) return;
      const bufferSize = this.ctx.sampleRate * 0.35;
      const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
      const noise = this.ctx.createBufferSource();
      noise.buffer = buffer;
      const filter = this.ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 1800;
      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(0.09, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.002, this.ctx.currentTime + 0.35);
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(this.ctx.destination);
      noise.start();
    } catch(e) {}
  },
  chime() {
    try {
      this.init();
      if (!this.ctx) return;
      [523.25, 659.25, 783.99].forEach((freq, idx) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.06);
        gain.gain.setValueAtTime(0.09, this.ctx.currentTime + idx * 0.06);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.06 + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(this.ctx.currentTime + idx * 0.06);
        osc.stop(this.ctx.currentTime + idx * 0.06 + 0.26);
      });
    } catch(e) {}
  }
};

// ====================================================
// 2. SMARTBOARD DRAWING & ACCOUNT STORAGE ENGINE
// ====================================================
let currentSlideIndex = 0;
let currentDrawTool = 'pen';
let currentPenColor = '#ffffff';
let currentPenSize = 3;
let isDrawing = false;
let currentStroke = null;

// Per-slide vector stroke storage: { [slideId]: [ strokeObj, ... ] }
let slideAnnotations = {};
let redoStacks = {};

const drawCanvas = document.getElementById('drawing-canvas');
const drawCtx = drawCanvas.getContext('2d');
const laserCanvas = document.getElementById('laser-canvas');
const laserCtx = laserCanvas.getContext('2d');
let laserPoints = [];

function resizeBoardCanvases() {
  const stage = document.getElementById('board-stage');
  const contentLayer = document.getElementById('slide-content-layer');
  const targetHeight = Math.max(1180, contentLayer.scrollHeight + 180, window.innerHeight - 52);
  stage.style.minHeight = targetHeight + 'px';

  const rect = stage.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  drawCanvas.width = rect.width * dpr;
  drawCanvas.height = targetHeight * dpr;
  drawCanvas.style.width = rect.width + 'px';
  drawCanvas.style.height = targetHeight + 'px';
  drawCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

  laserCanvas.width = rect.width * dpr;
  laserCanvas.height = targetHeight * dpr;
  laserCanvas.style.width = rect.width + 'px';
  laserCanvas.style.height = targetHeight + 'px';
  laserCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

  renderCurrentSlideStrokes();
}

window.addEventListener('resize', resizeBoardCanvases);

function getSlideKey(idx = currentSlideIndex) {
  const s = SLIDES[idx];
  return s ? s.id : ('slide_' + idx);
}

function renderStroke(ctx, s, stageW) {
  if (!s || !s.points || s.points.length === 0) return;
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  if (s.tool === 'eraser') {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.lineWidth = s.size * 5.5;
  } else if (s.tool === 'highlighter') {
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = s.color;
    ctx.globalAlpha = 0.34;
    ctx.lineWidth = s.size * 4.2;
  } else {
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = s.color;
    ctx.globalAlpha = 1.0;
    ctx.lineWidth = s.size;
  }

  const pts = s.points.map(p => ({
    x: p.nx ? p.nx * stageW : p.x,
    y: p.y
  }));

  if (s.tool === 'line') {
    const p0 = pts[0];
    const p1 = pts[pts.length - 1];
    ctx.beginPath();
    ctx.moveTo(p0.x, p0.y);
    ctx.lineTo(p1.x, p1.y);
    ctx.stroke();
  } else if (s.tool === 'rect') {
    const p0 = pts[0];
    const p1 = pts[pts.length - 1];
    ctx.strokeRect(p0.x, p0.y, p1.x - p0.x, p1.y - p0.y);
  } else {
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) {
      const midX = (pts[i - 1].x + pts[i].x) / 2;
      const midY = (pts[i - 1].y + pts[i].y) / 2;
      ctx.quadraticCurveTo(pts[i - 1].x, pts[i - 1].y, midX, midY);
    }
    if (pts.length > 1) {
      const last = pts[pts.length - 1];
      ctx.lineTo(last.x, last.y);
    } else {
      ctx.arc(pts[0].x, pts[0].y, s.size / 2, 0, Math.PI * 2);
    }
    ctx.stroke();
  }
  ctx.restore();
}

function renderCurrentSlideStrokes() {
  const stageW = drawCanvas.clientWidth || 1400;
  drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
  const key = getSlideKey();
  const strokes = slideAnnotations[key] || [];
  for (const s of strokes) {
    renderStroke(drawCtx, s, stageW);
  }
  if (currentStroke) {
    renderStroke(drawCtx, currentStroke, stageW);
  }
}

function getStageCoords(e) {
  const rect = drawCanvas.getBoundingClientRect();
  const stageW = drawCanvas.clientWidth || 1400;
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  return { x, y, nx: x / stageW };
}

drawCanvas.addEventListener('pointerdown', (e) => {
  if (currentDrawTool === 'pan') return;
  if (e.button !== 0 && e.pointerType === 'mouse') return;
  drawCanvas.setPointerCapture(e.pointerId);
  isDrawing = true;
  const pt = getStageCoords(e);

  if (currentDrawTool === 'laser') {
    laserPoints.push({ x: pt.x, y: pt.y, t: performance.now() });
    requestAnimationFrame(updateLaserTrail);
    return;
  }

  currentStroke = {
    tool: currentDrawTool,
    color: currentPenColor,
    size: Number(currentPenSize),
    points: [pt]
  };
  renderCurrentSlideStrokes();
});

drawCanvas.addEventListener('pointermove', (e) => {
  if (!isDrawing) return;
  const pt = getStageCoords(e);

  if (currentDrawTool === 'laser') {
    laserPoints.push({ x: pt.x, y: pt.y, t: performance.now() });
    requestAnimationFrame(updateLaserTrail);
    return;
  }

  if (!currentStroke) return;
  if (currentDrawTool === 'line' || currentDrawTool === 'rect') {
    currentStroke.points[1] = pt;
  } else {
    currentStroke.points.push(pt);
  }
  renderCurrentSlideStrokes();
});

function finishStroke(e) {
  if (!isDrawing) return;
  isDrawing = false;
  if (currentDrawTool === 'laser') return;
  if (currentStroke) {
    const key = getSlideKey();
    if (!slideAnnotations[key]) slideAnnotations[key] = [];
    slideAnnotations[key].push(currentStroke);
    redoStacks[key] = [];
    currentStroke = null;
    renderCurrentSlideStrokes();
    persistAnnotationsToStorage();
  }
}

drawCanvas.addEventListener('pointerup', finishStroke);
drawCanvas.addEventListener('pointercancel', finishStroke);

function updateLaserTrail() {
  const now = performance.now();
  laserPoints = laserPoints.filter(p => now - p.t < 420);
  laserCtx.clearRect(0, 0, laserCanvas.width, laserCanvas.height);

  if (laserPoints.length > 1) {
    for (let i = 1; i < laserPoints.length; i++) {
      const age = (now - laserPoints[i].t) / 420;
      const alpha = Math.max(0, 1 - age);
      laserCtx.save();
      laserCtx.beginPath();
      laserCtx.moveTo(laserPoints[i - 1].x, laserPoints[i - 1].y);
      laserCtx.lineTo(laserPoints[i].x, laserPoints[i].y);
      laserCtx.strokeStyle = `rgba(248, 113, 113, ${alpha})`;
      laserCtx.lineWidth = 5 * alpha + 2;
      laserCtx.shadowColor = '#ef4444';
      laserCtx.shadowBlur = 12;
      laserCtx.lineCap = 'round';
      laserCtx.stroke();
      laserCtx.restore();
    }
    const last = laserPoints[laserPoints.length - 1];
    laserCtx.save();
    laserCtx.beginPath();
    laserCtx.arc(last.x, last.y, 6, 0, Math.PI * 2);
    laserCtx.fillStyle = '#ffffff';
    laserCtx.shadowColor = '#ef4444';
    laserCtx.shadowBlur = 16;
    laserCtx.fill();
    laserCtx.restore();
  }

  if (isDrawing || laserPoints.length > 0) {
    requestAnimationFrame(updateLaserTrail);
  }
}

}

// LocalStorage / IndexedDB & Per-Account Cloud API Integration
const LESSON_ID = 'chemistry-acid-base';
let currentStorageKey = 'acid_base_smartboard_notes_v1_guest';
let currentAccountUser = null;
let cloudSyncTimer = null;
let hasPendingCloudSync = false;

function persistAnnotationsToStorage() {
  try {
    localStorage.setItem(currentStorageKey, JSON.stringify(slideAnnotations));
  } catch(e) {}
  // Schedule cloud sync for logged-in account
  scheduleCloudAccountSync();
  // Trigger custom hook for backend user account integration
  if (typeof window.onSmartboardNotesChanged === 'function') {
    window.onSmartboardNotesChanged(slideAnnotations);
  }
}

function loadAnnotationsFromStorage() {
  try {
    const raw = localStorage.getItem(currentStorageKey);
    slideAnnotations = raw ? JSON.parse(raw) : {};
  } catch(e) {
    slideAnnotations = {};
  }
}

function updateAccountSyncUI(state, detailText) {
  const widget = document.getElementById('account-sync-widget');
  const badgeEl = document.getElementById('account-user-badge');
  const statusEl = document.getElementById('account-sync-status');
  if (!widget || !badgeEl || !statusEl) return;

  if (!currentAccountUser) {
    widget.style.borderColor = 'rgba(251, 146, 60, 0.45)';
    widget.style.cursor = 'default';
    widget.onclick = null;
    badgeEl.style.color = '#fb923c';
    badgeEl.innerHTML = '👤 ผู้เยี่ยมชม';
    statusEl.innerHTML = '<a href="/login?callbackUrl=/lessons/chemistry/acid-base/index.html" style="color:#facc15; font-weight:700; text-decoration:none; padding:2px 7px; border-radius:5px; background:rgba(250,204,21,0.15); border:1px solid rgba(250,204,21,0.4);">🔐 เข้าสู่ระบบเพื่อผูกโน้ต</a>';
    return;
  }

  widget.style.cursor = 'pointer';
  widget.title = `บัญชี: ${currentAccountUser.name} (คลิกเพื่อซิงก์โน้ตขึ้นระบบทันที)`;
  widget.onclick = () => syncNotesToAccountNow(true);
  badgeEl.style.color = '#38bdf8';
  badgeEl.textContent = `👤 ${currentAccountUser.name}`;

  if (state === 'saving') {
    widget.style.borderColor = 'rgba(250, 204, 21, 0.5)';
    statusEl.style.color = '#facc15';
    statusEl.textContent = '• ⏳ กำลังบันทึก...';
  } else if (state === 'saved') {
    widget.style.borderColor = 'rgba(74, 222, 128, 0.45)';
    statusEl.style.color = '#4ade80';
    statusEl.textContent = `• ☁️ ${detailText || 'ซิงก์แล้ว'}`;
  } else if (state === 'error') {
    widget.style.borderColor = 'rgba(248, 113, 113, 0.5)';
    statusEl.style.color = '#f87171';
    statusEl.textContent = '• ⚠️ ออฟไลน์ (เซฟในเครื่อง)';
  }
}

function scheduleCloudAccountSync() {
  if (!currentAccountUser) return;
  hasPendingCloudSync = true;
  updateAccountSyncUI('saving');
  if (cloudSyncTimer) clearTimeout(cloudSyncTimer);
  cloudSyncTimer = setTimeout(() => {
    syncNotesToAccountNow(false);
  }, 650);
}

async function syncNotesToAccountNow(manualClick) {
  if (!currentAccountUser) return;
  if (cloudSyncTimer) {
    clearTimeout(cloudSyncTimer);
    cloudSyncTimer = null;
  }
  updateAccountSyncUI('saving');
  try {
    const res = await fetch('/api/notes', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        lessonId: LESSON_ID,
        annotations: slideAnnotations
      })
    });
    if (res.ok) {
      hasPendingCloudSync = false;
      const nowTime = new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
      updateAccountSyncUI('saved', `บันทึกแล้ว ${nowTime}`);
      if (manualClick && typeof SoundFX !== 'undefined') SoundFX.chime();
    } else {
      updateAccountSyncUI('error');
    }
  } catch (err) {
    updateAccountSyncUI('error');
  }
}

async function initAccountAndSmartboardNotes() {
  try {
    const res = await fetch(`/api/notes?lessonId=${encodeURIComponent(LESSON_ID)}`, {
      method: 'GET',
      cache: 'no-store'
    });
    const data = await res.json();

    if (data && data.authenticated && data.user) {
      currentAccountUser = data.user;
      const cleanId = String(data.user.id || data.user.name || 'user').trim().toLowerCase();
      currentStorageKey = `acid_base_smartboard_notes_v1_user_${cleanId}`;

      const serverNotes = data.annotations;
      const hasServerNotes = serverNotes && typeof serverNotes === 'object' && Object.keys(serverNotes).length > 0;

      if (hasServerNotes) {
        slideAnnotations = serverNotes;
        try {
          localStorage.setItem(currentStorageKey, JSON.stringify(slideAnnotations));
        } catch(e) {}
      } else {
        // Check if this specific user had local notes cached on this browser
        loadAnnotationsFromStorage();
        if (slideAnnotations && Object.keys(slideAnnotations).length > 0) {
          syncNotesToAccountNow(false);
        }
      }
      renderCurrentSlideStrokes();
      updateAccountSyncUI('saved', 'ซิงก์บัญชีแล้ว');
    } else {
      currentAccountUser = null;
      currentStorageKey = 'acid_base_smartboard_notes_v1_guest';
      loadAnnotationsFromStorage();
      renderCurrentSlideStrokes();
      updateAccountSyncUI('guest');
    }
  } catch (err) {
    currentAccountUser = null;
    currentStorageKey = 'acid_base_smartboard_notes_v1_guest';
    loadAnnotationsFromStorage();
    renderCurrentSlideStrokes();
    updateAccountSyncUI('guest');
  }
}

// Flush pending notes if user closes or switches tab immediately after writing
window.addEventListener('beforeunload', () => {
  if (currentAccountUser && hasPendingCloudSync) {
    try {
      fetch('/api/notes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          lessonId: LESSON_ID,
          annotations: slideAnnotations
        }),
        keepalive: true
      });
    } catch (e) {}
  }
});

  SoundFX.click();
  const payload = {
    course: 'เคมี ม.5 : กรด-เบส',
    account: currentAccountUser ? currentAccountUser.name : 'guest',
    savedAt: new Date().toISOString(),
    annotations: slideAnnotations
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const userTag = currentAccountUser ? `_${currentAccountUser.name}` : '';
  a.download = `โน้ตกรดเบส${userTag}_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}

function loadNotesJSON(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (data && data.annotations) {
        slideAnnotations = data.annotations;
        persistAnnotationsToStorage();
        renderCurrentSlideStrokes();
        SoundFX.chime();
        alert('โหลดข้อมูลลายมือเข้าสู่กระดานเรียบร้อยแล้ว!');
      }
    } catch(err) {
      alert('ไฟล์โน้ตไม่ถูกต้อง');
    }
  };
  reader.readAsText(file);
}

  'q2-basic-4',

]);
for (let i = SLIDES.length - 1; i >= 0; i--) {
  if (REDUNDANT_MULTI_CALC_IDS.has(SLIDES[i].id)) {
    SLIDES.splice(i, 1);
  }
}
SLIDES.sort((a, b) => {
  const ga = parseInt(a.group, 10) || 0;
  const gb = parseInt(b.group, 10) || 0;
  if (ga !== gb) return ga - gb;
  return 0;
});

// ====================================================
// 3. SLIDE NAVIGATION, CONSOLIDATED SIDEBAR & QUESTION BAR
// ====================================================
function isQuizSlide(s) {
  return s && (s.id.startsWith('q') || s.id.startsWith('ex'));
}

function isRealExamSlide(s) {
  return s && s.id.startsWith('ex');
}

function getDeckForSlideIndex(idx) {
  const cur = SLIDES[idx];
  if (!cur || !isQuizSlide(cur)) return [];
  if (isRealExamSlide(cur)) {
    return SLIDES.map((s, i) => ({ slide: s, idx: i })).filter(x => isRealExamSlide(x.slide));
  }
  // Exercise deck for the same topic group
  return SLIDES.map((s, i) => ({ slide: s, idx: i })).filter(x => x.slide.group === cur.group && x.slide.id.startsWith('q'));
}

function buildSidebarTOC(filterText = '') {
  const tocContainer = document.getElementById('toc-list');
  tocContainer.innerHTML = '';
  const q = filterText.trim().toLowerCase();

  // Group slides by s.group
  const groups = [];
  const groupMap = {};
  SLIDES.forEach((s, idx) => {
    if (q && !s.title.toLowerCase().includes(q) && !s.group.toLowerCase().includes(q) && !String(idx + 1).includes(q)) {
      return;
    }
    if (!groupMap[s.group]) {
      groupMap[s.group] = { name: s.group, items: [] };
      groups.push(groupMap[s.group]);
    }
    groupMap[s.group].items.push({ slide: s, idx });
  });

  groups.forEach(g => {
    const groupDiv = document.createElement('div');
    groupDiv.className = 'toc-group';

    // Separate theory slides vs exercise/exam slides when not searching
    const theoryItems = g.items.filter(x => !isQuizSlide(x.slide));
    const quizItems = g.items.filter(x => isQuizSlide(x.slide));
    const isExamGroup = g.name.startsWith('10.');

    // If this is Group 10 (Real Exam Bank) and no search filter is active, render as ONE single prominent bar!
    if (isExamGroup && !q && quizItems.length > 0) {
      const isCurrentInExam = quizItems.some(x => x.idx === currentSlideIndex);
      const targetIdx = isCurrentInExam ? currentSlideIndex : quizItems[0].idx;
      const activePos = isCurrentInExam ? (quizItems.findIndex(x => x.idx === currentSlideIndex) + 1) : 1;

      const singleExamBar = document.createElement('div');
      singleExamBar.className = 'toc-deck-item' + (isCurrentInExam ? ' active' : '');
      singleExamBar.innerHTML = `
        <div style="display:flex; flex-direction:column; gap:2px; overflow:hidden;">
          <span style="font-size:13.5px; font-weight:700;">🏆 10. ข้อสอบจริงท้ายบท (คลังข้อสอบ)</span>
          <span style="font-size:11px; opacity:0.85;">เลือกทำทีละข้อ (${ isCurrentInExam ? 'กำลังอยู่ที่ข้อ ' + activePos + '/' + quizItems.length : 'รวมทั้งหมด ' + quizItems.length + ' ข้อ' })</span>
        </div>
        <span class="badge-page" style="background:rgba(0,0,0,0.25); color:inherit;">${quizItems.length} ข้อ ▶</span>
      `;
      singleExamBar.onclick = () => {
        SoundFX.click();
        goToSlide(targetIdx);
      };
      tocContainer.appendChild(singleExamBar);
      return;
    }

    const header = document.createElement('div');
    header.className = 'toc-group-header';
    const summaryLabel = quizItems.length > 0 && !q
      ? `${theoryItems.length} เนื้อหา + ${quizItems.length} โจทย์ ▾`
      : `${g.items.length} หน้า ▾`;
    header.innerHTML = `<span>${g.name}</span><span style="font-size:11px; color:var(--text-muted);">${summaryLabel}</span>`;
    header.onclick = () => groupDiv.classList.toggle('closed');
    groupDiv.appendChild(header);

    const itemsBox = document.createElement('div');
    itemsBox.className = 'toc-group-items';

    // If searching, show matching items directly
    const itemsToRender = q ? g.items : theoryItems;

    itemsToRender.forEach(({ slide, idx }) => {
      const item = document.createElement('div');
      item.className = 'toc-item' + (idx === currentSlideIndex ? ' active' : '');
      item.id = 'toc-item-' + idx;

      let badgesHtml = '';
      if (slide.lab3d) badgesHtml += `<span class="badge-3d" title="มีห้องแล็บ 3D">3D</span>`;
      if (slide.anim) badgesHtml += `<span class="badge-anim" title="มี Animation Graphic">Anim</span>`;
      if (isQuizSlide(slide)) badgesHtml += `<span class="badge-quiz">โจทย์</span>`;
      badgesHtml += `<span class="badge-page">น.${idx + 1}</span>`;

      item.innerHTML = `
        <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${slide.title}</span>
        <div class="toc-item-badges">${badgesHtml}</div>
      `;
      item.onclick = () => {
        SoundFX.click();
        goToSlide(idx);
      };
      itemsBox.appendChild(item);
    });

    // Collapse topic's exercises into a single clean bar at the bottom of that topic group
    if (!q && quizItems.length > 0) {
      const isCurrentInTopicQuiz = quizItems.some(x => x.idx === currentSlideIndex);
      const targetQuizIdx = isCurrentInTopicQuiz ? currentSlideIndex : quizItems[0].idx;
      const curQuizNum = isCurrentInTopicQuiz ? (quizItems.findIndex(x => x.idx === currentSlideIndex) + 1) : 1;

      const quizDeckBtn = document.createElement('div');
      quizDeckBtn.className = 'toc-deck-item' + (isCurrentInTopicQuiz ? ' active' : '');
      quizDeckBtn.innerHTML = `
        <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
          📝 แบบฝึกหัดท้ายหัวข้อ (${isCurrentInTopicQuiz ? 'ข้อที่ ' + curQuizNum + '/' + quizItems.length : 'รวม ' + quizItems.length + ' ข้อ'})
        </span>
        <span class="badge-page" style="background:rgba(0,0,0,0.2); color:inherit;">ทีละข้อ ▶</span>
      `;
      quizDeckBtn.onclick = () => {
        SoundFX.click();
        goToSlide(targetQuizIdx);
      };
      itemsBox.appendChild(quizDeckBtn);
    }

    groupDiv.appendChild(itemsBox);
    tocContainer.appendChild(groupDiv);
  });
}

function updateQuestionNavBar(idx) {
  const bar = document.getElementById('question-nav-bar');
  const slide = SLIDES[idx];
  if (!bar || !slide || !isQuizSlide(slide)) {
    if (bar) bar.classList.remove('show');
    return;
  }

  bar.classList.add('show');
  const deck = getDeckForSlideIndex(idx);
  const pos = deck.findIndex(x => x.idx === idx);

  const badgeEl = document.getElementById('qnav-deck-badge');
  const counterEl = document.getElementById('qnav-counter');
  const selectEl = document.getElementById('qnav-select');
  const prevBtn = document.getElementById('qnav-prev-btn');
  const nextBtn = document.getElementById('qnav-next-btn');

  if (isRealExamSlide(slide)) {
    badgeEl.textContent = '🏆 คลังข้อสอบจริงท้ายบท (A-Level / Entrance / สสวท.)';
  } else {
    badgeEl.textContent = `📝 แบบฝึกหัด : ${slide.group}`;
  }

  counterEl.textContent = `ข้อที่ ${pos + 1} / ${deck.length}`;

  selectEl.innerHTML = '';
  deck.forEach((item, i) => {
    const opt = document.createElement('option');
    opt.value = item.idx;
    opt.textContent = `[ข้อที่ ${i + 1}/${deck.length}] ${item.slide.title}`;
    if (item.idx === idx) opt.selected = true;
    selectEl.appendChild(opt);
  });

  prevBtn.disabled = pos <= 0;
  nextBtn.disabled = pos >= deck.length - 1;
}

function prevQuestionInDeck() {
  const deck = getDeckForSlideIndex(currentSlideIndex);
  const pos = deck.findIndex(x => x.idx === currentSlideIndex);
  if (pos > 0) {
    SoundFX.click();
    goToSlide(deck[pos - 1].idx);
  }
}

function nextQuestionInDeck() {
  const deck = getDeckForSlideIndex(currentSlideIndex);
  const pos = deck.findIndex(x => x.idx === currentSlideIndex);
  if (pos >= 0 && pos < deck.length - 1) {
    SoundFX.click();
    goToSlide(deck[pos + 1].idx);
  }
}

function firstQuestionInDeck() {
  const deck = getDeckForSlideIndex(currentSlideIndex);
  if (deck.length > 0) {
    SoundFX.click();
    goToSlide(deck[0].idx);
  }
}

function randomQuestionInDeck() {
  const deck = getDeckForSlideIndex(currentSlideIndex);
  if (deck.length > 1) {
    SoundFX.chime();
    let r = Math.floor(Math.random() * deck.length);
    if (deck[r].idx === currentSlideIndex) r = (r + 1) % deck.length;
    goToSlide(deck[r].idx);
  }
}

function goToSlide(idx) {
  if (idx < 0 || idx >= SLIDES.length) return;
  currentSlideIndex = idx;
  const slide = SLIDES[idx];

  document.getElementById('slide-content-layer').innerHTML = slide.html;
  document.getElementById('page-indicator').textContent = `หน้า ${idx + 1} / ${SLIDES.length}`;
  document.getElementById('current-section-badge').textContent = `${slide.group} • ${slide.badge || ''}`;

  // Show/hide small feature buttons on topbar
  const btn3d = document.getElementById('btn-open-3d');
  const btnAnim = document.getElementById('btn-open-anim');
  btn3d.classList.toggle('show', Boolean(slide.lab3d));
  btnAnim.classList.toggle('show', Boolean(slide.anim));

  // Update Single Question Navigation Bar
  updateQuestionNavBar(idx);

  // Rebuild TOC so active deck counters & highlights stay in sync
  const searchVal = document.getElementById('toc-search-input') ? document.getElementById('toc-search-input').value : '';
  buildSidebarTOC(searchVal);

  const activeItem = document.querySelector('#toc-list .toc-item.active, #toc-list .toc-deck-item.active');
  if (activeItem) {
    activeItem.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  document.getElementById('board-viewport').scrollTop = 0;
  setTimeout(resizeBoardCanvases, 30);
}

function prevSlide() {
  if (currentSlideIndex > 0) {
    SoundFX.click();
    goToSlide(currentSlideIndex - 1);
  }
}

function nextSlide() {
  if (currentSlideIndex < SLIDES.length - 1) {
    SoundFX.click();
    goToSlide(currentSlideIndex + 1);
  }
}

function promptJumpPage() {
  const input = prompt(`ระบุหมายเลขหน้าที่ต้องการไป (1 - ${SLIDES.length}):`, currentSlideIndex + 1);
  if (input) {
    const p = parseInt(input, 10);
    if (!isNaN(p) && p >= 1 && p <= SLIDES.length) {
      goToSlide(p - 1);
    }
  }
}

window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
  if (document.getElementById('modal-3d').classList.contains('open') ||
      document.getElementById('modal-anim').classList.contains('open')) {
    if (e.key === 'Escape') {
      close3DLab();
      closeAnimationModal();
    }
    return;
  }
  if (e.key === 'ArrowRight' || e.key === 'PageDown') nextSlide();
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') prevSlide();
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undoStroke(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); redoStroke(); }
});

// 4. INTERACTIVE 3D LAB ENGINE (THREE.JS WEBGL)

let threeRenderer = null;
let threeScene = null;
let threeCamera = null;
let threeAnimId = null;
let current3DUpdateFn = null;
let cameraOrbit = { theta: 0.4, phi: 1.1, radius: 11, targetY: 1.2, isDragging: false, lastX: 0, lastY: 0 };

function initThreeStage() {
  const container = document.getElementById('three-canvas-container');
  container.innerHTML = '';
  const w = container.clientWidth || 900;
  const h = container.clientHeight || 520;

  threeScene = new THREE.Scene();
  threeCamera = new THREE.PerspectiveCamera(45, w / h, 0.1, 100);

  threeRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  threeRenderer.setSize(w, h);
  threeRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(threeRenderer.domElement);

  const ambient = new THREE.AmbientLight(0xffffff, 0.78);
  threeScene.add(ambient);

  const dirLight = new THREE.DirectionalLight(0xffffff, 0.95);
  dirLight.position.set(8, 14, 10);
  threeScene.add(dirLight);

  const pointLight = new THREE.PointLight(0x38bdf8, 0.6, 25);
  pointLight.position.set(-6, 6, 4);
  threeScene.add(pointLight);

  // Lab Table Floor
  const floorGeo = new THREE.CylinderGeometry(9, 9, 0.3, 48);
  const floorMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.4, metalness: 0.2 });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.position.y = -0.2;
  threeScene.add(floor);

  const grid = new THREE.GridHelper(16, 16, 0x38bdf8, 0x334155);
  grid.position.y = -0.04;
  threeScene.add(grid);

  // Orbit Camera Mouse Controls
  const dom = threeRenderer.domElement;
  dom.addEventListener('pointerdown', e => {
    cameraOrbit.isDragging = true;
    cameraOrbit.lastX = e.clientX;
    cameraOrbit.lastY = e.clientY;
  });
  window.addEventListener('pointermove', e => {
    if (!cameraOrbit.isDragging) return;
    const dx = e.clientX - cameraOrbit.lastX;
    const dy = e.clientY - cameraOrbit.lastY;
    cameraOrbit.lastX = e.clientX;
    cameraOrbit.lastY = e.clientY;
    cameraOrbit.theta -= dx * 0.008;
    cameraOrbit.phi = Math.max(0.3, Math.min(1.48, cameraOrbit.phi - dy * 0.008));
  });
  window.addEventListener('pointerup', () => { cameraOrbit.isDragging = false; });
  dom.addEventListener('wheel', e => {
    e.preventDefault();
    cameraOrbit.radius = Math.max(5, Math.min(20, cameraOrbit.radius + e.deltaY * 0.006));
  }, { passive: false });
}

function updateCameraPosition() {
  if (!threeCamera) return;
  const { theta, phi, radius, targetY } = cameraOrbit;
  threeCamera.position.x = radius * Math.sin(phi) * Math.sin(theta);
  threeCamera.position.y = targetY + radius * Math.cos(phi);
  threeCamera.position.z = radius * Math.sin(phi) * Math.cos(theta);
  threeCamera.lookAt(0, targetY, 0);
}

function animateThreeLoop() {
  threeAnimId = requestAnimationFrame(animateThreeLoop);
  updateCameraPosition();
  if (typeof current3DUpdateFn === 'function') {
    current3DUpdateFn(performance.now() * 0.001);
  }
  if (threeRenderer && threeScene && threeCamera) {
    threeRenderer.render(threeScene, threeCamera);
  }
}

function openCurrent3DLab() {
  const slide = SLIDES[currentSlideIndex];
  if (!slide || !slide.lab3d) return;
  SoundFX.chime();
  document.getElementById('modal-3d').classList.add('open');
  setTimeout(() => {
    initThreeStage();
    const labType = slide.lab3d;
    if (labType === 'lab_conductivity') setupLab1Conductivity();
    else if (labType === 'lab_lewis3d') setupLab2Lewis3D();
    else if (labType === 'lab_salt3d') setupLab3SaltHydrolysis();
    else if (labType === 'lab_indicator3d') setupLab4Indicator();
    else if (labType === 'lab_titration3d') setupLab5Titration();

    if (threeAnimId) cancelAnimationFrame(threeAnimId);
    animateThreeLoop();
  }, 20);
}

function close3DLab() {
  SoundFX.click();
  document.getElementById('modal-3d').classList.remove('open');
  if (threeAnimId) cancelAnimationFrame(threeAnimId);
  current3DUpdateFn = null;
}

      'ข้อควรระวังในการทำข้อสอบ',
      `• <b>อิเล็กโทรไลต์ไม่จำเป็นต้องเป็นกรดหรือเบสเสมอไป</b> เช่น เกลือ NaCl นำไฟฟ้าได้ดีมากแต่เป็นกลาง<br>• ความสว่างของหลอดไฟขึ้นอยู่กับ <b>ความเข้มข้นของไอออนรวม</b> ในสารละลาย`
    );
  };

  window.triggerLab1DipLitmus = () => {

  window.triggerLab1DropMg = () => {

      labState.bubbling = true;
      particles.forEach(p => {
        p.visible = true;
        p.material.color.setHex(0xffffff);
      });
      document.getElementById('lab1-status').innerHTML += `<br><span style="color:#4ade80;">⚡ เกิดฟองแก๊ส H₂(g) พุ่งขึ้นมา! (Mg + 2H⁺ ⟶ Mg²⁺ + H₂)</span>`;
    } else {
      SoundFX.click();
      document.getElementById('lab1-status').innerHTML += `<br><span style="color:#facc15;">ℹ️ สารนี้ไม่ทำปฏิกิริยากับลวด Mg จึงไม่เกิดฟองแก๊ส H₂</span>`;
    }
  };

  const ctrl = document.getElementById('lab-3d-controls');
  ctrl.innerHTML = `
    <div class="lab-control-card">
      <h4>1. เลือกสารละลายในบีกเกอร์ 3D</h4>
      <button class="lab-btn lab1-sub-btn active" data-sub="HCl" onclick="selectLab1Sub('HCl')">🧪 HCl (กรดแก่ - อิเล็กโทรไลต์แก่)</button>
      <button class="lab-btn lab1-sub-btn" data-sub="CH3COOH" onclick="selectLab1Sub('CH3COOH')">🧪 CH₃COOH (กรดอ่อน)</button>
      <button class="lab-btn lab1-sub-btn" data-sub="NaOH" onclick="selectLab1Sub('NaOH')">🧪 NaOH (เบสแก่ - อิเล็กโทรไลต์แก่)</button>
      <button class="lab-btn lab1-sub-btn" data-sub="NH3" onclick="selectLab1Sub('NH3')">🧪 NH₃ (เบสอ่อน)</button>
      <button class="lab-btn lab1-sub-btn" data-sub="NaCl" onclick="selectLab1Sub('NaCl')">🧂 NaCl (เกลือโซเดียมคลอไรด์)</button>
      <button class="lab-btn lab1-sub-btn" data-sub="C6H12O6" onclick="selectLab1Sub('C6H12O6')">🍬 C₆H₁₂O₆ (น้ำตาลกลูโคส)</button>
    </div>
    <div class="lab-control-card">
      <h4>2. ทดลองจุ่มทดสอบสมบัติ</h4>
      <button class="lab-btn" onclick="triggerLab1DipLitmus()">📄 จุ่มกระดาษลิตมัสลงในบีกเกอร์</button>

    </div>
    <div class="lab-control-card">
      <h4>สถานะปัจจุบัน</h4>
      <div id="lab1-status" style="font-size:13.5px; line-height:1.5;"></div>
    </div>
  `;
  window.selectLab1Sub('HCl');

    particles.forEach((p, i) => {
      if (!p.visible) return;
      if (labState.bubbling) {
        p.position.y += 0.045;
        if (p.position.y > 2.4) p.position.y = 0.2;
      } else {
        p.position.x += Math.sin(t * 2 + i) * 0.008;
        p.position.y += Math.cos(t * 1.8 + i) * 0.006;
      }
    });
  };
}

// LAB 3D #2: โมเลกุล 3 มิติ ทฤษฎีกรด-เบสลิวอิส (NH3 + BF3)
// ----------------------------------------------------
function setupLab2Lewis3D() {
  document.getElementById('modal-3d-title').textContent = '🎮 ห้องแล็บ 3D #2 : โมเลกุล 3 มิติ และการสร้างพันธะโคออร์ดิเนตตามทฤษฎีลิวอิส';
  cameraOrbit.radius = 9.5;
  cameraOrbit.targetY = 2.0;

  const nh3Group = new THREE.Group();
  nh3Group.position.set(-2.4, 2.0, 0);
  threeScene.add(nh3Group);

  const nAtom = new THREE.Mesh(new THREE.SphereGeometry(0.55, 28, 28), new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.2 }));
  nh3Group.add(nAtom);

  const hMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
  [0, (2 * Math.PI) / 3, (4 * Math.PI) / 3].forEach(ang => {
    const h = new THREE.Mesh(new THREE.SphereGeometry(0.32, 20, 20), hMat);
    const hy = Math.cos(ang) * 0.95;
    const hz = Math.sin(ang) * 0.95;
    h.position.set(-0.65, hy, hz);
    nh3Group.add(h);
  });

  const lobeGeo = new THREE.SphereGeometry(0.42, 24, 24);
  lobeGeo.scale(1.5, 0.85, 0.85);
  const lobeMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, emissive: 0xfacc15, emissiveIntensity: 0.8, transparent: true, opacity: 0.65 });
  const lonePairLobe = new THREE.Mesh(lobeGeo, lobeMat);
  lonePairLobe.position.set(0.75, 0, 0);
  nh3Group.add(lonePairLobe);

  const bf3Group = new THREE.Group();
  bf3Group.position.set(2.4, 2.0, 0);
  threeScene.add(bf3Group);

  const bAtom = new THREE.Mesh(new THREE.SphereGeometry(0.52, 28, 28), new THREE.MeshStandardMaterial({ color: 0xf472b6, roughness: 0.2 }));
  bf3Group.add(bAtom);

  const fAtoms = [];
  const fMat = new THREE.MeshStandardMaterial({ color: 0x4ade80, roughness: 0.2 });
  [0, (2 * Math.PI) / 3, (4 * Math.PI) / 3].forEach(ang => {
    const f = new THREE.Mesh(new THREE.SphereGeometry(0.38, 20, 20), fMat);
    f.userData = { ang };
    f.position.set(0, Math.cos(ang) * 1.15, Math.sin(ang) * 1.15);
    bf3Group.add(f);
    fAtoms.push(f);
  });

  const coordBond = new THREE.Mesh(
    new THREE.CylinderGeometry(0.14, 0.14, 1.6, 20),
    new THREE.MeshStandardMaterial({ color: 0xfacc15, emissive: 0xfacc15, emissiveIntensity: 1.0 })
  );
  coordBond.rotation.z = Math.PI / 2;
  coordBond.position.set(0, 2.0, 0);
  coordBond.visible = false;
  threeScene.add(coordBond);

  let progress = 0;
  let targetProgress = 0;

  function updateLewisExp(val) {
    const bonded = val > 0.7;
    setModalExplanation(
      'lab-3d-explanation',
      'ทฤษฎีกรด-เบสของลิวอิส (Lewis Theory)',
      `• <b>กรดลิวอิส (Lewis Acid)</b> = สารที่<b>รับ</b>คู่อิเล็กตรอน (เช่น BF₃, AlCl₃, H⁺, Cu²⁺, SbF₅)<br>• <b>เบสลิวอิส (Lewis Base)</b> = สารที่<b>ให้</b>คู่อิเล็กตรอนโดดเดี่ยว (เช่น NH₃, H₂O, OH⁻, Cl⁻)`,
      bonded ? 'สถานะปัจจุบัน : สร้างพันธะโคออร์ดิเนตโคเวเลนต์แล้ว (H₃N→BF₃)' : 'สถานะปัจจุบัน : โมเลกุลแยกกันก่อนเกิดปฏิกิริยา',
      bonded
        ? `อะตอม <b>N (สีน้ำเงิน)</b> ใน NH₃ ยื่นคู่อิเล็กตรอนโดดเดี่ยว (สีทอง) เข้าไปในออร์บิทัลว่างของ <b>B (สีชมพู)</b> ใน BF₃ เกิดเป็น<b>พันธะโคออร์ดิเนตโคเวเลนต์</b> และรูปร่างรอบอะตอม B เปลี่ยนจากสามเหลี่ยมแบนราบ (sp²) เป็นทรงสี่หน้า (sp³)!`
        : `สังเกตกลีบออร์บิทัล<b>สีทองเรืองแสง</b>บนอะตอม N ของ NH₃ คือคู่อิเล็กตรอนโดดเดี่ยว (Lone pair) ส่วนอะตอม B ของ BF₃ มีอิเล็กตรอนวงนอกเพียง 6 ตัว (ไม่ครบ 8) จึงมีออร์บิทัลว่างพร้อมรับคู่อิเล็กตรอน`,
      'จุดเน้นข้อสอบ A-Level',
      `ปฏิกิริยาตามทฤษฎีลิวอิส<b>ไม่จำเป็นต้องมีการโอนโปรตอน (H⁺)</b> เสมอไป เช่น การเกิดสารประกอบเชิงซ้อนของโลหะทรานซิชัน หรือปฏิกิริยาระหว่างออกไซด์อโลหะกับออกไซด์โลหะ`
    );
  }

  window.setLewisProgress = (val) => {
    targetProgress = Number(val);
    if (targetProgress > 0.85) SoundFX.chime();
    else SoundFX.click();
    updateLewisExp(targetProgress);
  };

  const ctrl = document.getElementById('lab-3d-controls');
  ctrl.innerHTML = `
    <div class="lab-control-card">
      <h4>ปฏิกิริยากรด-เบสลิวอิส : NH₃ + BF₃ ⟶ H₃N→BF₃</h4>
      <p style="font-size:13px; color:#cbd5e1; line-height:1.5; margin-bottom:12px;">
        • <b style="color:#38bdf8;">NH₃ (เบสลิวอิส)</b>: อะตอม N มีคู่อิเล็กตรอนโดดเดี่ยว (กลีบสีทองเรืองแสง) พร้อมจ่ายให้<br>
        • <b style="color:#f472b6;">BF₃ (กรดลิวอิส)</b>: อะตอม B มีเวเลนซ์อิเล็กตรอนเพียง 6 ตัว จึงมีออร์บิทัลว่างพร้อมรับคู่อิเล็กตรอน
      </p>
      <button class="lab-btn active" onclick="setLewisProgress(1)">⚡ ยิงชนสร้างพันธะโคออร์ดิเนต (Bond!)</button>
      <button class="lab-btn" onclick="setLewisProgress(0)">🔄 แยกโมเลกุลกลับสู่สถานะตั้งต้น</button>
    </div>
    <div class="lab-control-card">
      <h4>ลากปรับระยะห่างระหว่างโมเลกุล</h4>
      <input type="range" min="0" max="1" step="0.01" value="0" style="width:100%;" oninput="setLewisProgress(this.value)">
    </div>
  `;
  updateLewisExp(0);

  current3DUpdateFn = (t) => {
    progress += (targetProgress - progress) * 0.08;
    nh3Group.position.x = -2.4 + progress * 1.55;
    bf3Group.position.x = 2.4 - progress * 1.55;

    fAtoms.forEach(f => {
      const ang = f.userData.ang;
      f.position.x = progress * 0.45;
      f.position.y = Math.cos(ang) * 1.15;
      f.position.z = Math.sin(ang) * 1.15;
    });

    coordBond.visible = progress > 0.72;
    nh3Group.rotation.x = t * 0.4;
    bf3Group.rotation.x = t * 0.4;
  };
}

      desc: 'เกลือจากกรดแก่ (HCl) + เบสอ่อน (NH₃) ไอออน Cl⁻ ไม่ทำปฏิกิริยากับน้ำ แต่ไอออนบวก NH₄⁺ จ่ายโปรตอนให้ H₂O เกิดเป็น H₃O⁺ สารละลายจึงมีฤทธิ์เป็นกรด (pH ≈ 5.1 สีส้มเหลือง)'

    }
  ];

  const tubeMeshes = [];
  const glassMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.28, roughness: 0.1 });

  tubesData.forEach((td) => {
    const tube = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 3.6, 28, 1, true), glassMat);
    tube.position.set(td.x, 2.0, 0);
    threeScene.add(tube);

    const liq = new THREE.Mesh(new THREE.CylinderGeometry(0.50, 0.50, 2.2, 28), liqMat);
    liq.position.set(td.x, 1.3, 0);

  window.dropUniversalToTube = (idx) => {

    document.getElementById('lab3-info').innerHTML = 'สารละลายเกลือใสไม่มีสีทั้ง 4 หลอด พร้อมทดสอบหยด Universal Indicator';
  };
