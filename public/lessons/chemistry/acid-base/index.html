// LAB 3D #5: ห้องแล็บไทเทรตกรด-เบส 3 มิติ (สมจริง: ชมพูอ่อนจางๆ ที่จุดยุติ -> เข้มขึ้นเรื่อยๆ เมื่อเลยจุดยุติ!)
// ----------------------------------------------------
function setupLab5Titration() {
  document.getElementById('modal-3d-title').textContent = '🎮 ห้องแล็บ 3D #5 : การไทเทรตกรด-เบสเสมือนจริง (สังเกตสีชมพูอ่อนที่จุดยุติ & สีเข้มขึ้นเมื่อเลยจุดยุติ)';
  cameraOrbit.radius = 10.2;
  cameraOrbit.targetY = 2.5;

  const metalMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.7, roughness: 0.3 });
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 6.5, 16), metalMat);
  pole.position.set(-1.6, 3.2, 0);
  threeScene.add(pole);

  // White Porcelain Tile under the flask so pink color tint is super clear like a real lab!
  const tile = new THREE.Mesh(
    new THREE.BoxGeometry(3.4, 0.12, 3.4),
    new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.25 })
  );
  tile.position.set(0, 0.02, 0);
  threeScene.add(tile);

  const clamp = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.15, 0.2), metalMat);
  clamp.position.set(-0.8, 4.5, 0);
  threeScene.add(clamp);

  // Burette glass + stopcock valve
  const glassMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.28, roughness: 0.08 });
  const burette = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 3.8, 24, 1, true), glassMat);
  burette.position.set(0, 4.7, 0);
  threeScene.add(burette);

  // Burette liquid inside
  const buretteLiqMat = new THREE.MeshPhysicalMaterial({ color: 0xbae6fd, transparent: true, opacity: 0.45 });
  const buretteLiq = new THREE.Mesh(new THREE.CylinderGeometry(0.19, 0.19, 3.2, 20), buretteLiqMat);
  buretteLiq.position.set(0, 4.7, 0);
  threeScene.add(buretteLiq);

  const stopcock = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.14, 0.14), new THREE.MeshStandardMaterial({ color: 0xef4444 }));
  stopcock.position.set(0, 2.75, 0);
  threeScene.add(stopcock);

  // Erlenmeyer Flask
  const flask = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 1.38, 2.35, 36, 1, true), glassMat);
  flask.position.set(0, 1.25, 0);
  threeScene.add(flask);

  const flaskLiqMat = new THREE.MeshPhysicalMaterial({
    color: 0xf8fafc,
    transparent: true,
    opacity: 0.42,
    roughness: 0.1
  });
  const flaskLiq = new THREE.Mesh(new THREE.CylinderGeometry(0.85, 1.30, 1.0, 36), flaskLiqMat);
  flaskLiq.position.set(0, 0.62, 0);
  threeScene.add(flaskLiq);

  // Transient Pink Splash Cloud inside the flask where the drop hits (before endpoint!)
  const splashMat = new THREE.MeshBasicMaterial({
    color: 0xf472b6,
    transparent: true,
    opacity: 0.0
  });
  const splashCloud = new THREE.Mesh(new THREE.SphereGeometry(0.38, 20, 20), splashMat);
  splashCloud.position.set(0, 0.92, 0);
  threeScene.add(splashCloud);

  // Magnetic Stir Bar spinning inside flask
  const stirBar = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.11, 0.18), new THREE.MeshStandardMaterial({ color: 0xffffff }));
  stirBar.position.set(0, 0.16, 0);
  threeScene.add(stirBar);

  // Falling Drop
  const dropMesh = new THREE.Mesh(new THREE.SphereGeometry(0.09, 14, 14), new THREE.MeshStandardMaterial({ color: 0x7dd3fc }));
  dropMesh.position.set(0, 2.65, 0);
  dropMesh.visible = false;
  threeScene.add(dropMesh);

  let titState = {
    volAdded: 0.0, // mL of 0.10 M NaOH added to 25.00 mL of 0.10 M Acid
    system: 'strong_strong',
    history: [{ v: 0, pH: 1.0 }],
    splashAlpha: 0.0,
    splashDecayRate: 0.03
  };

  function calcTitrationPH(v, sys) {
    const va = 25.0, ca = 0.1, cb = 0.1;
    if (sys === 'strong_strong') {
      if (Math.abs(v - 25.0) < 0.015) return 7.00;
      if (v < 25.0) {
        const h = ((ca * va) - (cb * v)) / (va + v);
        return -Math.log10(Math.max(1e-7, h));
      } else {
        // Notice: even 0.05 mL (1 drop) past 25.00 mL gives [OH-] = (0.1*0.05)/50.05 ≈ 1e-4 -> pH ≈ 10.0!
        // Wait: to simulate a realistic endpoint at V = 25.00 mL where 25.00 mL is the pale pink endpoint (pH ~ 8.3-8.5)
        // and overshooting beyond 25.00 mL gets progressively darker:
        if (Math.abs(v - 25.0) <= 0.03) return 8.45;
        const oh = ((cb * v) - (ca * va)) / (va + v);
        return 14.0 + Math.log10(Math.max(1e-7, oh));
      }
    } else {
      // Weak acid (CH3COOH Ka = 1.8e-5, pKa = 4.74) + Strong base NaOH
      const pKa = 4.74;
      if (v <= 0.01) return 2.87;
      if (Math.abs(v - 25.0) <= 0.03) return 8.72; // True Equivalence Point & Pale Pink Endpoint!
      if (v < 25.0) {
        const ratio = v / (25.0 - v);
        return pKa + Math.log10(ratio);
      } else {
        const oh = ((cb * v) - (ca * va)) / (va + v);
        return 14.0 + Math.log10(Math.max(1e-7, oh));
      }
    }
  }

  // Realistic Phenolphthalein Color Interpolation based on Equivalence & Overshoot Volume!
  // - Before endpoint (v < 24.98): Clear colorless liquid (with transient pink splash when drops fall)
  // - At Endpoint (v ≈ 25.00 mL, or 24.98 <= v <= 25.06): Very Pale Baby Pink (#fbcfe8)
  // - Past Endpoint (v > 25.06 mL): Smoothly and continuously darkens with every additional drop/mL!
  function getRealisticPhenolphthaleinVisual(v, pH) {
    if (v < 24.98) {
      return {
        r: 245, g: 248, b: 252,
        opacity: 0.42,
        cssHex: '#f1f5f9',
        stageLabel: '⚪ ก่อนจุดยุติ (ใสไม่มีสี - เกิดสีชมพูชั่วคราวตรงจุดที่หยดตกแล้วจางหาย)',
        stageColor: '#94a3b8'
      };
    }
    const overshoot = Math.max(0, v - 25.00);
    if (overshoot <= 0.06) {
      // Exact Endpoint! Very pale delicate baby pink!
      return {
        r: 252, g: 214, b: 235,
        opacity: 0.62,
        cssHex: '#fcd6eb',
        stageLabel: '🌸 จุดยุติพอดี! (สีชมพูอ่อนจางๆ คงอยู่ถาวร 30 วินาที - ต้องหยุดไทเทรตตรงนี้!)',
        stageColor: '#f9a8d4'
      };
    }

    // Progressive darkening as overshoot increases from 0.06 mL up to 8.0+ mL!
    // Use a non-linear curve so even +0.10, +0.20, +0.50, +1.0, +3.0, +8.0 mL visibly darken step-by-step!
    const t = Math.min(1.0, Math.pow(overshoot / 6.0, 0.52));
    // Interpolate from Pale Pink (252, 200, 228) -> Rose Pink (236, 72, 153) -> Deep Magenta/Crimson (131, 24, 67)
    let r, g, b;
    if (t < 0.5) {
      const k = t * 2; // 0 to 1
      r = Math.round(250 - k * (250 - 236));
      g = Math.round(190 - k * (190 - 64));
      b = Math.round(222 - k * (222 - 148));
    } else {
      const k = (t - 0.5) * 2; // 0 to 1
      r = Math.round(236 - k * (236 - 125));
      g = Math.round(64 - k * (64 - 14));
      b = Math.round(148 - k * (148 - 68));
    }
    const opacity = +(0.66 + t * 0.29).toFixed(2);
    const hex = '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');

    let descLabel = '';
    if (overshoot <= 0.25) {
      descLabel = `🌷 เลยจุดยุติเล็กน้อย (+${overshoot.toFixed(2)} mL) : สีชมพูเริ่มเข้มขึ้นกว่าจุดยุติ`;
    } else if (overshoot <= 1.20) {
      descLabel = `🌺 เลยจุดยุติ (+${overshoot.toFixed(2)} mL) : สีชมพูบานเย็นชัดเจน (เบสเกินจุดสมมูล)`;
    } else {
      descLabel = `🟣 เลยจุดยุติมาก (+${overshoot.toFixed(2)} mL) : สีชมพูม่วงแดงเข้มจัด! (ยิ่งเติมเบสเกิน สียิ่งเข้มทึบเรื่อยๆ)`;
    }

    return {
      r, g, b,
      opacity,
      cssHex: hex,
      stageLabel: descLabel,
      stageColor: '#f472b6'
    };
  }

  function drawMiniTitrationGraph() {
    const c = document.getElementById('titration-mini-canvas');
    if (!c) return;
    const ctx = c.getContext('2d');
    ctx.clearRect(0, 0, c.width, c.height);

    ctx.strokeStyle = '#64748b';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(35, 10); ctx.lineTo(35, 155); ctx.lineTo(295, 155);
    ctx.stroke();

    // Phenolphthalein transition zone band (pH 8.3 - 10.0)
    const y83 = 155 - (8.3 / 14) * 138;
    const y100 = 155 - (10.0 / 14) * 138;
    ctx.fillStyle = 'rgba(244, 114, 182, 0.16)';
    ctx.fillRect(35, y100, 260, y83 - y100);

    // Equivalence line at V = 25 mL
    const eqX = 35 + (25 / 50) * 250;
    ctx.strokeStyle = 'rgba(250, 204, 21, 0.45)';
    ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(eqX, 10); ctx.lineTo(eqX, 155); ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = '#94a3b8';
    ctx.font = '10px Prompt';
    ctx.fillText('pH', 8, 20);
    ctx.fillText('25 mL (สมมูล)', eqX - 28, 170);

    // Plot curve
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    titState.history.forEach((pt, idx) => {
      const x = 35 + (pt.v / 50) * 250;
      const y = 155 - (pt.pH / 14) * 138;
      if (idx === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.stroke();

    const last = titState.history[titState.history.length - 1];
    const lx = 35 + (last.v / 50) * 250;
    const ly = 155 - (last.pH / 14) * 138;
    ctx.fillStyle = '#f472b6';
    ctx.beginPath(); ctx.arc(lx, ly, 4.5, 0, Math.PI * 2); ctx.fill();
  }

  function updateTitrationVisualsAndExplanation() {
    const curPH = calcTitrationPH(titState.volAdded, titState.system);
    const vis = getRealisticPhenolphthaleinVisual(titState.volAdded, curPH);

    flaskLiqMat.color.setRGB(vis.r / 255, vis.g / 255, vis.b / 255);
    flaskLiqMat.opacity = vis.opacity;
    flaskLiq.scale.y = 1 + (titState.volAdded / 50) * 0.55;
    buretteLiq.scale.y = Math.max(0.05, 1 - (titState.volAdded / 55));

    // Trigger transient pink swirl when dropping before endpoint!
    if (titState.volAdded > 0 && titState.volAdded < 24.98) {
      titState.splashAlpha = 0.78;
      // Slower fade as we approach 25.00 mL (realistic local OH- concentration persistence)
      const dist = 25.0 - titState.volAdded;
      titState.splashDecayRate = dist < 1.5 ? 0.008 : 0.024;
    } else {
      titState.splashAlpha = 0.0;
    }

    document.getElementById('tit-readout').innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
        <span>ปริมาตร NaOH ที่หยด: <b style="color:#38bdf8; font-size:16px;">${titState.volAdded.toFixed(2)} mL</b></span>
        <span><b style="color:#facc15; font-size:16px;">pH = ${curPH.toFixed(2)}</b></span>
      </div>
      <div style="display:flex; align-items:center; gap:8px; padding:6px 10px; border-radius:8px; background:rgba(0,0,0,0.35); border:1px solid rgba(255,255,255,0.12);">
        <span style="width:20px; height:20px; border-radius:50%; background:${vis.cssHex}; border:1.5px solid #fff; flex-shrink:0;"></span>
        <span style="font-size:12px; color:${vis.stageColor}; font-weight:600; line-height:1.35;">${vis.stageLabel}</span>
      </div>
    `;
    drawMiniTitrationGraph();

    const sysName = titState.system === 'strong_strong'
      ? 'กรดแก่ HCl (0.10 M 25.00 mL) + เบสแก่ NaOH (0.10 M)'
      : 'กรดอ่อน CH₃COOH (0.10 M 25.00 mL) + เบสแก่ NaOH (0.10 M)';

    setModalExplanation(
      'lab-3d-explanation',
      `หลักการสังเกตสีที่จุดยุติ (${sysName})`,
      `ในการไทเทรตด้วยอินดิเคเตอร์ <b>ฟีนอล์ฟทาลีน (ช่วงเปลี่ยนสี pH 8.3 – 10.0)</b>:<br>• <b>ก่อนจุดยุติ (< 25.00 mL)</b>: สารละลายใสไม่มีสี เมื่อหยด NaOH ลงไปจะเห็น<b>สีชมพูแวบหนึ่งตรงจุดที่หยดตก</b>แล้วจางหายเมื่อแกว่งผสม<br>• <b>ที่จุดยุติพอดี (25.00 mL)</b>: สารละลายเปลี่ยนเป็น<b>สีชมพูอ่อนจางๆ</b> คงอยู่ไม่จางหาย`,
      `สิ่งที่เกิดขึ้นในขวดรูปกรวยขณะนี้ (V = ${titState.volAdded.toFixed(2)} mL, pH = ${curPH.toFixed(2)})`,
      vis.stageLabel + (titState.volAdded > 25.06
        ? `<br>⚠️ <b>คำอธิบาย:</b> ตอนนี้คุณหยดเบส NaOH <b>เลยจุดยุติมาแล้ว ${(titState.volAdded - 25.0).toFixed(2)} mL</b> เบสส่วนเกินทำให้ [OH⁻] และค่า pH พุ่งสูงขึ้น สัดส่วนของรูปไอออน In⁻ (สีชมพูบานเย็น) จึงเพิ่มขึ้นเรื่อยๆ ทำให้<b>สีชมพูยิ่งเข้มขึ้นตามปริมาณเบสที่หยดเกิน!</b>`
        : titState.volAdded >= 24.98
        ? `<br>✅ <b>ยอดเยี่ยม!</b> นี่คือสีชมพูอ่อนจางๆ ของจุดยุติที่ถูกต้องตามเทคนิคปฏิบัติการเคมี หากหยดเพิ่มอีกแม้แต่หยดเดียว สีจะเริ่มเข้มขึ้นทันที!`
        : `<br>💡 ลองกดปุ่ม <b>"ข้ามไปใกล้จุดยุติ (24.80 mL)"</b> แล้วค่อยๆ กดหยดทีละครึ่งหยด (+0.05 mL) เพื่อดูจังหวะเปลี่ยนเป็นสีชมพูอ่อนที่ 25.00 mL แล้วลองหยดต่อไปเรื่อยๆ เพื่อดูสีที่เข้มขึ้น!`),
      'สรุปความแตกต่าง จุดสมมูล vs จุดยุติ',
      `• <b>จุดสมมูล (Equivalence Point)</b>: จุดตามทฤษฎีที่กรดและเบสทำปฏิกิริยากันพอดีตามสมการ (V = 25.00 mL)<br>• <b>จุดยุติ (Endpoint)</b>: จุดในการทดลองจริงที่อินดิเคเตอร์เริ่มเปลี่ยนเป็นสีชมพูอ่อนถาวร ต้องหยุดไทเทรตทันที!`
    );
  }

  window.addTitrantVol = (dv) => {
    SoundFX.drop();
    dropMesh.visible = true;
    dropMesh.position.y = 2.65;
    const steps = Math.max(1, Math.round(dv / 0.05));
    const stepV = dv / steps;
    for (let i = 0; i < steps; i++) {
      if (titState.volAdded + stepV <= 50.0) {
        titState.volAdded = +(titState.volAdded + stepV).toFixed(2);
        const pH = calcTitrationPH(titState.volAdded, titState.system);
        titState.history.push({ v: titState.volAdded, pH });
      }
    }
    if (Math.abs(titState.volAdded - 25.0) <= 0.05) {
      SoundFX.chime();
    }
    updateTitrationVisualsAndExplanation();
  };

  window.jumpNearEndpoint = () => {
    SoundFX.chime();
    titState.volAdded = 0;
    titState.history = [{ v: 0, pH: calcTitrationPH(0, titState.system) }];
    for (let v = 0.5; v <= 24.80; v = +(v + 0.5).toFixed(2)) {
      titState.volAdded = v;
      titState.history.push({ v, pH: calcTitrationPH(v, titState.system) });
    }
    updateTitrationVisualsAndExplanation();
  };

  window.setTitSystem = (sys) => {
    SoundFX.click();
    titState.system = sys;
    titState.volAdded = 0;
    const pH0 = calcTitrationPH(0, sys);
    titState.history = [{ v: 0, pH: pH0 }];
    document.querySelectorAll('.tit-sys-btn').forEach(b => b.classList.toggle('active', b.dataset.sys === sys));
    updateTitrationVisualsAndExplanation();
  };

  const ctrl = document.getElementById('lab-3d-controls');
  ctrl.innerHTML = `
    <div class="lab-control-card">
      <h4>1. เลือกระบบการไทเทรต (กรด 0.10 M 25.0 mL + ฟีนอล์ฟทาลีน)</h4>
      <button class="lab-btn tit-sys-btn active" data-sys="strong_strong" onclick="setTitSystem('strong_strong')">🧪 HCl (กรดแก่) + NaOH (เบสแก่)</button>
      <button class="lab-btn tit-sys-btn" data-sys="weak_strong" onclick="setTitSystem('weak_strong')">🧪 CH₃COOH (กรดอ่อน) + NaOH (เบสแก่)</button>
    </div>
    <div class="lab-control-card">
      <h4>2. ควบคุมก๊อกบิวเรตต์หยด NaOH (0.10 M)</h4>
      <div id="tit-readout" style="font-size:14px; margin-bottom:10px;"></div>
      <button class="lab-btn" style="background:rgba(250,204,21,0.16); border-color:#facc15; color:#facc15;" onclick="jumpNearEndpoint()">🎯 ข้ามไปใกล้จุดยุติ (24.80 mL) เพื่อซ้อมหยด!</button>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px;">
        <button class="lab-btn active" onclick="addTitrantVol(0.05)">💧 ครึ่งหยด (+0.05 mL)</button>
        <button class="lab-btn active" onclick="addTitrantVol(0.10)">💧 1 หยด (+0.10 mL)</button>
        <button class="lab-btn" onclick="addTitrantVol(0.50)">+ เติม 0.50 mL</button>
        <button class="lab-btn" onclick="addTitrantVol(1.00)">+ เติม 1.00 mL</button>
        <button class="lab-btn" onclick="addTitrantVol(5.00)">+ เติม 5.00 mL</button>
        <button class="lab-btn" onclick="setTitSystem(titState.system)">🔄 รีเซ็ต (0.00 mL)</button>
      </div>
    </div>
    <div class="lab-control-card">
      <h4>กราฟการไทเทรตแบบเรียลไทม์ (จุดสมมูล = 25.00 mL)</h4>
      <canvas id="titration-mini-canvas" width="310" height="175" style="width:100%; background:#0f172a; border-radius:8px;"></canvas>
    </div>
  `;
  window.setTitSystem('strong_strong');

  current3DUpdateFn = (t) => {
    stirBar.rotation.y = t * 14;
    if (dropMesh.visible) {
      dropMesh.position.y -= 0.15;
      if (dropMesh.position.y < 0.85) dropMesh.visible = false;
    }
    if (titState.splashAlpha > 0) {
      titState.splashAlpha = Math.max(0, titState.splashAlpha - titState.splashDecayRate);
      splashMat.opacity = titState.splashAlpha;
      const scale = 0.7 + (1 - titState.splashAlpha) * 1.4;
      splashCloud.scale.set(scale, 0.55, scale);
    } else {
      splashMat.opacity = 0;
    }
  };
}

// ====================================================
// 5. ANIMATION GRAPHIC ENGINE (2D PARTICLE & MOLECULAR)
// ====================================================
let animGraphicId = null;
let currentAnimRenderFn = null;

function openCurrentAnimation() {
  const slide = SLIDES[currentSlideIndex];
  if (!slide || !slide.anim) return;
  SoundFX.chime();
  document.getElementById('modal-anim').classList.add('open');

  const animType = slide.anim;
  if (animType === 'anim_electrolyte') setupAnim1Electrolyte();
  else if (animType === 'anim_bronsted') setupAnim2Bronsted();
  else if (animType === 'anim_equilibrium') setupAnim3Equilibrium();
  else if (animType === 'anim_hydrolysis') setupAnim4Hydrolysis();
  else if (animType === 'anim_buffer') setupAnim5Buffer();

  if (animGraphicId) cancelAnimationFrame(animGraphicId);
  function loop() {
    animGraphicId = requestAnimationFrame(loop);
    if (typeof currentAnimRenderFn === 'function') {
      currentAnimRenderFn(performance.now() * 0.001);
    }
  }
  loop();
}

function closeAnimationModal() {
  SoundFX.click();
  document.getElementById('modal-anim').classList.remove('open');
  if (animGraphicId) cancelAnimationFrame(animGraphicId);
  currentAnimRenderFn = null;
}

// ----------------------------------------------------
// Animation #1: เปรียบเทียบการแตกตัว 3 บีกเกอร์ (อิเล็กโทรไลต์แก่ / อ่อน / นอนอิเล็กโทรไลต์)
// ----------------------------------------------------
function setupAnim1Electrolyte() {
  document.getElementById('modal-anim-title').textContent = '🎬 Animation Graphic #1 : เปรียบเทียบการแตกตัวในน้ำระดับอนุภาค (แก่ vs อ่อน vs นอนอิเล็กโทรไลต์)';
  const canvas = document.getElementById('anim-graphic-canvas');
  const ctx = canvas.getContext('2d');

  const ctrl = document.getElementById('anim-graphic-controls');
  ctrl.innerHTML = `
    <div class="lab-control-card">
      <h4>เปรียบเทียบอนุภาคในสารละลายทั้ง 3 ชนิด</h4>
      <p style="font-size:13px; line-height:1.6; color:#cbd5e1;">
        • <b style="color:#4ade80;">บีกเกอร์ที่ 1 (HCl - กรดแก่)</b>: แตกตัว 100% เป็น H₃O⁺ (ชมพู) และ Cl⁻ (เขียว) ไม่มีโมเลกุล HCl เหลืออยู่เลย<br><br>
        • <b style="color:#facc15;">บีกเกอร์ที่ 2 (HCN - กรดอ่อน)</b>: ส่วนใหญ่อยู่ในรูปโมเลกุล HCN ที่ไม่แตกตัว มีเพียงส่วนน้อยที่แตกตัวเป็น H⁺ กับ CN⁻ แล้วชนกันรวมตัวกลับตลอดเวลา (⇌)<br><br>
        • <b style="color:#38bdf8;">บีกเกอร์ที่ 3 (C₆H₁₂O₆ - นอนอิเล็กโทรไลต์)</b>: โมเลกุลน้ำตาลกลูโคสกระจายตัวในน้ำโดยไม่แตกตัวเป็นไอออนเลย
      </p>
    </div>
  `;

  setModalExplanation(
    'anim-graphic-explanation',
    'หลักการแตกตัวเป็นไอออนในน้ำ (Ionization & Dissociation)',
    `• <b>อิเล็กโทรไลต์แก่ (Strong Electrolyte)</b>: แตกตัวเป็นไอออนได้สมบูรณ์ 100% ใช้ลูกศรทางเดียว (⟶) เช่น กรดแก่ 6 ชนิด (HClO₄, HI, HBr, HCl, HNO₃, H₂SO₄) และเบสแก่หมู่ 1A, 2A<br>• <b>อิเล็กโทรไลต์อ่อน (Weak Electrolyte)</b>: แตกตัวได้บางส่วน เกิดสมดุลไดนามิก (⇌)`,
    'สิ่งที่สังเกตเห็นในภาพเคลื่อนไหวระดับโมเลกุล',
    `สังเกต<b>บีกเกอร์กลาง (HCN)</b>: โมเลกุลสีเทาส่วนใหญ่ยังคงเป็นโมเลกุล HCN มีเพียงบางอนุภาคที่กะพริบเปลี่ยนเป็นไอออนสีเหลือง (H⁺ และ CN⁻) แล้วรวมตัวกลับเป็น HCN ตลอดเวลา แสดงถึง<b>สมดุลไดนามิก</b>ที่อัตราการแตกตัวไปข้างหน้าเท่ากับอัตราการรวมตัวกลับ`,
    'ความเข้าใจคลาดเคลื่อนที่พบบ่อย',
    `นักเรียนมักสับสนระหว่าง <b>"การละลายน้ำ"</b> กับ <b>"การแตกตัวเป็นไอออน"</b> — น้ำตาลกลูโคสละลายน้ำได้ดีมาก (เป็นสารละลายใส) แต่<b>ไม่แตกตัวเป็นไอออนเลย</b> จึงไม่นำไฟฟ้า`
  );

  const particles = [];
  for (let b = 0; b < 3; b++) {
    for (let i = 0; i < 16; i++) {
      particles.push({
        beaker: b,
        x: 80 + b * 360 + Math.random() * 210,
        y: 230 + Math.random() * 310,
        vx: (Math.random() - 0.5) * 2.2,
        vy: (Math.random() - 0.5) * 2.2,
        idx: i
      });
    }
  }

  currentAnimRenderFn = (t) => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const titles = [
      { title: '1. อิเล็กโทรไลต์แก่ (HCl)', sub: 'HCl ⟶ H⁺ + Cl⁻ (แตกตัว 100%)', col: '#4ade80' },
      { title: '2. อิเล็กโทรไลต์อ่อน (HCN)', sub: 'HCN ⇌ H⁺ + CN⁻ (สมดุลไป-กลับ)', col: '#facc15' },
      { title: '3. นอนอิเล็กโทรไลต์ (C₆H₁₂O₆)', sub: 'ละลายน้ำแต่ไม่แตกตัวเป็นไอออน', col: '#38bdf8' }
    ];

    titles.forEach((info, b) => {
      const bx = 55 + b * 360;
      ctx.fillStyle = info.col;
      ctx.font = 'bold 20px Prompt';
      ctx.fillText(info.title, bx + 10, 58);
      ctx.fillStyle = '#94a3b8';
      ctx.font = '15px Prompt';
      ctx.fillText(info.sub, bx + 10, 88);

      ctx.fillStyle = 'rgba(56, 189, 248, 0.09)';
      ctx.fillRect(bx, 185, 280, 385);
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 3;
      ctx.strokeRect(bx, 125, 280, 445);
    });

    particles.forEach(p => {
      const minX = 75 + p.beaker * 360;
      const maxX = minX + 240;
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < minX || p.x > maxX) p.vx *= -1;
      if (p.y < 210 || p.y > 545) p.vy *= -1;

      ctx.beginPath();
      if (p.beaker === 0) {
        const isH = p.idx % 2 === 0;
        ctx.arc(p.x, p.y, isH ? 12 : 16, 0, Math.PI * 2);
        ctx.fillStyle = isH ? '#f472b6' : '#4ade80';
        ctx.fill();
        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 11px Prompt';
        ctx.fillText(isH ? 'H⁺' : 'Cl⁻', p.x - 8, p.y + 4);
      } else if (p.beaker === 1) {
        const isIonized = p.idx < 3 && Math.sin(t * 2 + p.idx) > 0;
        ctx.arc(p.x, p.y, 17, 0, Math.PI * 2);
        ctx.fillStyle = isIonized ? '#facc15' : '#64748b';
        ctx.fill();
        ctx.fillStyle = isIonized ? '#0f172a' : '#fff';
        ctx.font = 'bold 11px Prompt';
        ctx.fillText(isIonized ? 'H⁺/CN⁻' : 'HCN', p.x - 14, p.y + 4);
      } else {
        ctx.arc(p.x, p.y, 20, 0, Math.PI * 2);
        ctx.fillStyle = '#38bdf8';
        ctx.fill();
        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 10px Prompt';
        ctx.fillText('C₆H₁₂O₆', p.x - 18, p.y + 4);
      }
    });
  };
}

// Animation #2: การโยน-รับโปรตอน (H+) ตามทฤษฎีเบรินสเตด-ลาวรี
// ----------------------------------------------------
function setupAnim2Bronsted() {
  document.getElementById('modal-anim-title').textContent = '🎬 Animation Graphic #2 : การถ่ายโอนโปรตอน (H⁺ Transfer) และคู่กรด-เบส';
  const canvas = document.getElementById('anim-graphic-canvas');
  const ctx = canvas.getContext('2d');
  let direction = 1;

  function updateBronstedExplanation() {
    setModalExplanation(
      'anim-graphic-explanation',
      'ทฤษฎีกรด-เบสของเบรินสเตด-ลาวรี (Brønsted–Lowry)',
      `• <b>กรด (Acid)</b> = สารที่ทำหน้าที่<b>ให้โปรตอน (H⁺ donor)</b> แก่สารอื่น<br>• <b>เบส (Base)</b> = สารที่ทำหน้าที่<b>รับโปรตอน (H⁺ acceptor)</b> จากสารอื่น<br>• <b>คู่กรด-เบส (Conjugate Acid-Base Pair)</b> คือสารคู่ที่มีจำนวน H⁺ ต่างกันอยู่ <b>1 ตัว (1 H⁺)</b>`,
      direction === 1
        ? 'ปฏิกิริยาไปข้างหน้า : CH₃COOH(aq) + H₂O(l) ⟶ CH₃COO⁻(aq) + H₃O⁺(aq)'
        : 'ปฏิกิริยาย้อนกลับ : CH₃COO⁻(aq) + H₃O⁺(aq) ⟶ CH₃COOH(aq) + H₂O(l)',
      direction === 1
        ? `โมเลกุล <b>CH₃COOH</b> โยนโปรตอน (H⁺ สีเหลืองทอง) ไปให้โมเลกุล <b>H₂O</b>:<br>• CH₃COOH เสีย H⁺ 1 ตัว กลายเป็นคู่เบส <b>CH₃COO⁻</b><br>• H₂O รับ H⁺ 1 ตัว กลายเป็นคู่กรด <b>H₃O⁺</b>`
        : `ไอออน <b>H₃O⁺ (คู่กรด)</b> โยนโปรตอน (H⁺) ย้อนกลับคืนให้ไอออน <b>CH₃COO⁻ (คู่เบส)</b>:<br>• H₃O⁺ ทำหน้าที่เป็นกรดในปฏิกิริยาย้อนกลับ กลายเป็น H₂O<br>• CH₃COO⁻ ทำหน้าที่เป็นเบสรับ H⁺ กลับเป็น CH₃COOH`,
      'หลักการหาคู่กรดและคู่เบสในข้อสอบ',
      `• อยากหา <b>"คู่กรด"</b> ของสารใด ⟶ ให้ <b>บวก H⁺ เพิ่ม 1 ตัว</b> (ประจุเพิ่มขึ้น +1)<br>• อยากหา <b>"คู่เบส"</b> ของสารใด ⟶ ให้ <b>ลบ H⁺ ออก 1 ตัว</b> (ประจุลดลง -1)`
    );
  }

  window.setBronstedDir = (d) => {
    SoundFX.drop();
    direction = d;
    updateBronstedExplanation();
  };

  const ctrl = document.getElementById('anim-graphic-controls');
  ctrl.innerHTML = `
    <div class="lab-control-card">
      <h4>จำลองการโยนโปรตอน (H⁺) ไป-กลับ</h4>
      <button class="lab-btn active" onclick="setBronstedDir(1)">▶️ ปฏิกิริยาไปข้างหน้า (CH₃COOH จ่าย H⁺ ให้ H₂O)</button>
      <button class="lab-btn" onclick="setBronstedDir(-1)">◀️ ปฏิกิริยาย้อนกลับ (H₃O⁺ จ่าย H⁺ คืนให้ CH₃COO⁻)</button>
    </div>
  `;
  updateBronstedExplanation();

  currentAnimRenderFn = (t) => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#facc15';
    ctx.font = 'bold 25px Prompt';
    ctx.fillText('ทฤษฎีเบรินสเตด-ลาวรี : กรด = ผู้ให้โปรตอน (H⁺)  |  เบส = ผู้รับโปรตอน (H⁺)', 140, 65);

    const phase = (Math.sin(t * 2.2 * direction) + 1) / 2;
    const leftX = 330, rightX = 790, centerY = 320;

    ctx.beginPath();
    ctx.arc(leftX, centerY, 76, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(244, 114, 182, 0.22)';
    ctx.strokeStyle = '#f472b6';
    ctx.lineWidth = 3;
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 23px Prompt';
    ctx.fillText(phase < 0.5 ? 'CH₃COOH' : 'CH₃COO⁻', leftX - 54, centerY + 8);
    ctx.fillStyle = '#f472b6';
    ctx.font = '18px Prompt';
    ctx.fillText('คู่กรด-เบส คู่ที่ 1 (กรด / คู่เบส)', leftX - 110, centerY + 120);

    ctx.beginPath();
    ctx.arc(rightX, centerY, 72, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(56, 189, 248, 0.22)';
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 3;
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 23px Prompt';
    ctx.fillText(phase < 0.5 ? 'H₂O' : 'H₃O⁺', rightX - 28, centerY + 8);
    ctx.fillStyle = '#38bdf8';
    ctx.font = '18px Prompt';
    ctx.fillText('คู่กรด-เบส คู่ที่ 2 (เบส / คู่กรด)', rightX - 110, centerY + 120);

    const hx = leftX + 65 + phase * (rightX - leftX - 130);
    const hy = centerY - Math.sin(phase * Math.PI) * 145;
    ctx.beginPath();
    ctx.arc(hx, hy, 27, 0, Math.PI * 2);
    ctx.fillStyle = '#facc15';
    ctx.fill();
    ctx.fillStyle = '#0f172a';
    ctx.font = 'bold 19px Prompt';
    ctx.fillText('H⁺', hx - 12, hy + 7);
  };
}

// ----------------------------------------------------
// Animation #3: สมดุลการแตกตัวของกรดอ่อน (ปรับ C และ Ka ดู % การแตกตัว)
// ----------------------------------------------------
function setupAnim3Equilibrium() {
  document.getElementById('modal-anim-title').textContent = '🎬 Animation Graphic #3 : สมดุลการแตกตัวของกรดอ่อน (ผลของความเข้มข้น C และค่า Ka)';
  const canvas = document.getElementById('anim-graphic-canvas');
  const ctx = canvas.getContext('2d');
  let simC = 0.10;
  let simKaExp = -5;

  function refreshAnim3Exp() {
    const Ka = Math.pow(10, simKaExp);
    const h = Math.sqrt(Ka * simC);
    const pct = Math.min(100, (h / simC) * 100);
    const pH = -Math.log10(h);
    setModalExplanation(
      'anim-graphic-explanation',
      'สูตรคำนวณสมดุลการแตกตัวของกรดอ่อน (HA)',
      `• ความเข้มข้นของไฮโดรเนียมไอออน: <b>[H₃O⁺] = √(K<sub>a</sub> × C<sub>a</sub>)</b><br>• ร้อยละการแตกตัว (%): <b>% แตกตัว = ([H₃O⁺] / C<sub>a</sub>) × 100 = √(K<sub>a</sub> / C<sub>a</sub>) × 100</b>`,
      `ผลการคำนวณขณะนี้ (C = ${simC.toFixed(2)} M, Ka = 10^${simKaExp})`,
      `• <b>[H₃O⁺] = ${h.toExponential(2)} mol/L</b> ⟶ ค่า <b>pH = ${pH.toFixed(2)}</b><br>• <b>ร้อยละการแตกตัว = ${pct.toFixed(3)}%</b> (หมายความว่าใน 100 โมเลกุลของ HA แตกตัวเป็นไอออนเพียง ${pct.toFixed(2)} โมเลกุล)`,
      'ข้อสรุปสำคัญตามคู่มือครู สสวท.',
      `เมื่อเจือจางสารละลายกรดอ่อนด้วยน้ำ (<b>ลด C<sub>a</sub></b>):<br>1) ความเข้มข้น <b>[H₃O⁺] จะลดลง</b> (pH เพิ่มขึ้น)<br>2) แต่ <b>ร้อยละการแตกตัว (%) จะเพิ่มขึ้น!</b> (เป็นไปตามกฎการเจือจางของออสต์วัลด์)`
    );
  }

  window.updateAnim3Params = () => {
    simC = parseFloat(document.getElementById('anim3-c').value);

    SoundFX.click();
    refreshAnim3Exp();
  };

  const ctrl = document.getElementById('anim-graphic-controls');
  ctrl.innerHTML = `
    <div class="lab-control-card">
      <h4>ปรับความเข้มข้นเริ่มต้น (C<sub>a</sub>) และค่า K<sub>a</sub></h4>
      <label style="font-size:13px;">ความเข้มข้นกรด C<sub>a</sub> (mol/L):</label>
      <input id="anim3-c" type="range" min="0.01" max="1.0" step="0.01" value="0.10" style="width:100%; margin:6px 0 14px 0;" oninput="updateAnim3Params()">
      <label style="font-size:13px;">ค่าคงที่การแตกตัว K<sub>a</sub> (10<sup>x</sup>):</label>
      <input id="anim3-ka" type="range" min="-8" max="-2" step="0.5" value="-5" style="width:100%; margin:6px 0;" oninput="updateAnim3Params()">
    </div>
    <div class="lab-control-card">
      <h4>ข้อสังเกตสำคัญ (ตามคู่มือ สสวท.)</h4>
      <p style="font-size:13px; color:#cbd5e1; line-height:1.55;">
        • เมื่อค่า K<sub>a</sub> สูงขึ้น ⟶ กรดแตกตัวได้มากขึ้นทั้ง [H₃O⁺] และ % การแตกตัว<br>
        • เมื่อความเข้มข้น C<sub>a</sub> เพิ่มขึ้น ⟶ [H₃O⁺] เพิ่มขึ้น แต่ <b>ร้อยละการแตกตัว (%) จะลดลง!</b>
      </p>
    </div>
  `;
  refreshAnim3Exp();

  currentAnimRenderFn = () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const Ka = Math.pow(10, simKaExp);
    const h = Math.sqrt(Ka * simC);
    const pct = Math.min(100, (h / simC) * 100);

    ctx.fillStyle = '#facc15';

    ctx.font = '20px Prompt';

    ctx.fillText(`• ค่าคงที่การแตกตัว Ka = 1.0 × 10^(${simKaExp})`, 60, 160);

    ctx.fillStyle = '#fff';
    ctx.fillText(`C = ${simC.toFixed(2)} M`, 215, baseY + 35);

    ctx.fillStyle = '#38bdf8';
    ctx.fillRect(480, baseY - hBarPct, 120, hBarPct);
    ctx.fillStyle = '#fff';
    ctx.fillText(`% แตกตัว (${pct.toFixed(2)}%)`, 445, baseY + 35);
  };
}

// ----------------------------------------------------
// Animation #5: สารละลายบัฟเฟอร์ระดับโมเลกุลแบบสมจริงครบวงจร
// (ตั้งแต่การหยดผสมเตรียมบัฟเฟอร์ -> แยกเป็นขวดบัฟเฟอร์ -> เมื่อหยดกรด/เบส โมเลกุลไหนวิ่งไปจับ -> กราฟความเข้มข้นเพิ่ม/ลดแบบสด!)
// ----------------------------------------------------
function setupAnim5Buffer() {
  document.getElementById('modal-anim-title').textContent = '🎬 Animation Graphic #5 : การเตรียมสารละลายบัฟเฟอร์ และ กลไกการจับ H⁺ / OH⁻ ระดับโมเลกุล';
  const canvas = document.getElementById('anim-graphic-canvas');
  const ctx = canvas.getContext('2d');

  // State for the full Buffer Preparation + Molecular Capture simulation
  const bufSim = {
    prepMethod: 'direct_acid', // 'direct_acid' (CH3COOH + CH3COONa) or 'partial_acid' (CH3COOH excess + NaOH)
    prepProgress: 1.0,         // 0.0 -> 0.5 (pouring into mixing beaker) -> 1.0 (bottled into Buffer Vessel)
    isPreparing: false,
    haCount: 8,                // Number of CH3COOH molecules in Buffer Vessel
    aMinusCount: 8,            // Number of CH3COO- ions in Buffer Vessel
    pKa: 4.74,
    bufferPH: 4.74,
    waterPH: 7.00,
    deltaHA: 0,                // +1 or -1 indicator for last change
    deltaAMinus: 0,            // +1 or -1 indicator for last change
    lastEquation: 'CH₃COOH(aq) + H₂O(l) ⇌ CH₃COO⁻(aq) + H₃O⁺(aq)',
    lastEventBanner: 'สารละลายบัฟเฟอร์มีคู่กรด CH₃COOH (8 โมเลกุล) และคู่เบส CH₃COO⁻ (8 ไอออน) พร้อมควบคุม pH!',
    lastEventColor: '#38bdf8',
    molecules: [],             // Floating molecular clusters inside Buffer Vessel
    incomingDrops: [],         // Falling H+ or OH- droplets & active capture animations
    ripples: [],               // Water surface ripples
    flashRings: []             // Reaction collision shockwaves
  };

  function initBufferMolecules() {
    bufSim.molecules = [];
    // Box for Buffer Vessel liquid: x in [395, 765], y in [235, 555]
    for (let i = 0; i < bufSim.haCount; i++) {
      bufSim.molecules.push({
        type: 'HA', // CH3COOH (has golden H+ attached)
        x: 425 + Math.random() * 310,
        y: 265 + Math.random() * 265,
        vx: (Math.random() - 0.5) * 1.3,
        vy: (Math.random() - 0.5) * 1.3,
        busy: false
      });
    }
    for (let i = 0; i < bufSim.aMinusCount; i++) {
      bufSim.molecules.push({
        type: 'A-', // CH3COO- (conjugate base ready to grab H+)
        x: 425 + Math.random() * 310,
        y: 265 + Math.random() * 265,
        vx: (Math.random() - 0.5) * 1.3,
        vy: (Math.random() - 0.5) * 1.3,
        busy: false
      });
    }
    // Add a few spectator Na+ ions and background H2O molecules
    for (let i = 0; i < 5; i++) {
      bufSim.molecules.push({
        type: 'Na+',
        x: 425 + Math.random() * 310,
        y: 265 + Math.random() * 265,
        vx: (Math.random() - 0.5) * 0.9,
        vy: (Math.random() - 0.5) * 0.9,
        busy: false
      });
    }
  }

  function recalcBufferPH() {
    const ha = Math.max(0.2, bufSim.haCount);
    const am = Math.max(0.2, bufSim.aMinusCount);
    if (bufSim.haCount === 0) {
      bufSim.bufferPH = 11.80; // Buffer capacity broken by excess base
    } else if (bufSim.aMinusCount === 0) {
      bufSim.bufferPH = 1.90;  // Buffer capacity broken by excess acid
    } else {
      bufSim.bufferPH = +(bufSim.pKa + Math.log10(am / ha)).toFixed(2);
    }
  }

  function updateBufferExplanation(modeTitle, liveDetail) {
    const prepDesc = bufSim.prepMethod === 'direct_acid'
      ? `<b>วิธีที่ 1 (ผสมโดยตรง):</b> เทสารละลายกรดอ่อน <b>CH₃COOH</b> รวมกับสารละลายเกลือของกรดอ่อน <b>CH₃COONa</b> (ซึ่งแตกตัว 100% ให้ <b>CH₃COO⁻</b> และ Na⁺) จะได้สารละลายบัฟเฟอร์ที่มีทั้ง <b>CH₃COOH (กรดอ่อน)</b> และ <b>CH₃COO⁻ (คู่เบส)</b> อยู่ในขวดเดียวกัน`
      : `<b>วิธีที่ 2 (ทำปฏิกิริยาบางส่วน):</b> เทกรดอ่อน <b>CH₃COOH (ปริมาณมากเกินพอ เช่น 16 ส่วน)</b> ผสมกับเบสแก่ <b>NaOH (ปริมาณน้อยกว่า เช่น 8 ส่วน)</b> NaOH จะทำปฏิกิริยาเปลี่ยน CH₃COOH ครึ่งหนึ่งให้กลายเป็นเกลือ <b>CH₃COO⁻ (8 ส่วน)</b> และเหลือ <b>CH₃COOH (8 ส่วน)</b> กลายเป็นสารละลายบัฟเฟอร์!`;

    setModalExplanation(
      'anim-graphic-explanation',
      '1. การเตรียมสารละลายบัฟเฟอร์ (Buffer Preparation)',
      prepDesc,
      modeTitle || '2. กลไกระดับโมเลกุลเมื่อหยดกรด (H⁺) หรือเบส (OH⁻)',

    );

  // Trigger Step 2: Drop Strong Acid (H+) or Strong Base (OH-) into the Prepared Buffer Vessel!
  window.dropIntoBuffer = (type) => {
    if (type === 'reset') {

      const targetMol = bufSim.molecules.find(m => m.type === 'HA' && !m.busy);

  const ctrl = document.getElementById('anim-graphic-controls');
  ctrl.innerHTML = `

  initBufferMolecules();
  updateBufferExplanation();

  // Helper to draw a realistic 3D-shaded molecular cluster on 2D Canvas
  function drawMoleculeCluster(ctx, type, x, y, highlight = false) {
    ctx.save();
    if (highlight) {
      ctx.shadowColor = type === 'HA' ? '#f472b6' : '#38bdf8';
      ctx.shadowBlur = 16;
    }

    if (type === 'HA') {
      // Weak Acid CH3COOH: Pink acetate core + attached glowing Golden H+ proton!
      ctx.beginPath();
      ctx.arc(x - 6, y, 18, 0, Math.PI * 2);
      const grad = ctx.createRadialGradient(x - 10, y - 6, 3, x - 6, y, 18);
      grad.addColorStop(0, '#fbcfe8');
      grad.addColorStop(1, '#db2777');
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.fillStyle = '#fff';
      ctx.font = 'bold 9.5px Prompt';
      ctx.fillText('CH₃COO', x - 22, y + 3);

      // Attached Golden H+ Proton on the right
      ctx.beginPath();
      ctx.arc(x + 15, y - 4, 10, 0, Math.PI * 2);
      ctx.fillStyle = '#facc15';
      ctx.fill();
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 1.2;
      ctx.stroke();
      ctx.fillStyle = '#0f172a';
      ctx.font = 'bold 9.5px Prompt';
      ctx.fillText('H⁺', x + 9, y);
    } else if (type === 'A-') {
      // Conjugate Base CH3COO-: Cyan core + open docking pocket ring on the right!
      ctx.beginPath();
      ctx.arc(x - 4, y, 18, 0, Math.PI * 2);
      const grad = ctx.createRadialGradient(x - 8, y - 6, 3, x - 4, y, 18);
      grad.addColorStop(0, '#bae6fd');
      grad.addColorStop(1, '#0284c7');
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.fillStyle = '#fff';
      ctx.font = 'bold 9.5px Prompt';
      ctx.fillText('CH₃COO⁻', x - 23, y + 3);

      // Dashed receptor site waiting for H+
      ctx.beginPath();
      ctx.setLineDash([2, 2]);
      ctx.arc(x + 16, y - 4, 8, 0, Math.PI * 2);
      ctx.strokeStyle = '#facc15';
      ctx.lineWidth = 1.3;
      ctx.stroke();
      ctx.setLineDash([]);
    } else if (type === 'Na+') {
      ctx.beginPath();
      ctx.arc(x, y, 10, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(148, 163, 184, 0.45)';
      ctx.fill();
      ctx.fillStyle = '#e2e8f0';
      ctx.font = '9px Prompt';
      ctx.fillText('Na⁺', x - 8, y + 3);
    } else if (type === 'H2O_new') {
      ctx.beginPath();
      ctx.arc(x, y, 13, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(56, 189, 248, 0.75)';
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 10px Prompt';
      ctx.fillText('H₂O', x - 10, y + 4);
    }
    ctx.restore();
  }

  currentAnimRenderFn = (t) => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Mixing Beaker (Bottom of Zone 1)
    ctx.fillStyle = 'rgba(147, 51, 234, 0.16)';
    ctx.fillRect(65, 340, 225, 175);
    ctx.strokeStyle = '#cbd5e1';
    ctx.lineWidth = 2.5;
    ctx.strokeRect(65, 310, 225, 205);

    ctx.fillStyle = '#e2e8f0';

    ctx.fillStyle = '#facc15';
    ctx.font = 'bold 12.5px Prompt';

    // Animated Transfer Arrow from Mixing Beaker -> Main Buffer Vessel (Zone 2)
    ctx.save();
    ctx.strokeStyle = '#4ade80';
    ctx.lineWidth = 5;
    ctx.setLineDash([10, 6]);
    ctx.lineDashOffset = -t * 50;
    ctx.beginPath();
    ctx.moveTo(290, 420);
    ctx.lineTo(388, 420);
    ctx.stroke();
    ctx.restore();

    ctx.fillStyle = '#4ade80';
    ctx.font = 'bold 12px Prompt';
    ctx.fillText('แยกใส่ขวดบัฟเฟอร์ ▶', 292, 405);

    // =========================================================================
    // ZONE 2 (CENTER: x = 365..795): ขวดสารละลายบัฟเฟอร์ & กลไกโมเลกุลวิ่งจับ H+ / OH-
    // =========================================================================
    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold 16.5px Prompt';
    ctx.fillText('ขั้นที่ 2 : ขวดสารละลายบัฟเฟอร์ (เมื่อหยดกรด H⁺ หรือ เบส OH⁻)', 385, 92);

    // Two Realistic Droppers above Buffer Vessel
    // 1) Acid Dropper (x = 515)
    ctx.fillStyle = '#ea580c';
    ctx.beginPath(); ctx.roundRect(497, 102, 36, 22, 8); ctx.fill();
    ctx.fillStyle = '#cbd5e1';
    ctx.fillRect(510, 124, 10, 30);
    ctx.fillStyle = '#fb923c';
    ctx.font = 'bold 12.5px Prompt';
    ctx.fillText('หลอดหยดกรด (H⁺)', 435, 118);

    // 2) Base Dropper (x = 645)
    ctx.fillStyle = '#7c3aed';
    ctx.beginPath(); ctx.roundRect(627, 102, 36, 22, 8); ctx.fill();
    ctx.fillStyle = '#cbd5e1';
    ctx.fillRect(640, 124, 10, 30);
    ctx.fillStyle = '#a78bfa';
    ctx.font = 'bold 12.5px Prompt';
    ctx.fillText('หลอดหยดเบส (OH⁻)', 670, 118);

    // Main Buffer Solution Vessel (x = 390..770, y = 175..565)
    const vx = 390, vy = 175, vw = 380, vh = 390;
    const waterTop = 225;

    // Liquid background with animated gentle surface wave
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(vx, waterTop);
    for (let x = vx; x <= vx + vw; x += 20) {
      const waveY = waterTop + Math.sin(t * 3 + x * 0.04) * 3;
      ctx.lineTo(x, waveY);
    }
    ctx.lineTo(vx + vw, vy + vh);
    ctx.lineTo(vx, vy + vh);
    ctx.closePath();
    const liqGrad = ctx.createLinearGradient(0, waterTop, 0, vy + vh);
    liqGrad.addColorStop(0, 'rgba(56, 189, 248, 0.16)');
    liqGrad.addColorStop(1, 'rgba(15, 23, 42, 0.55)');
    ctx.fillStyle = liqGrad;
    ctx.fill();
    ctx.restore();

    // Vessel Glass Outline
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 3.5;
    ctx.strokeRect(vx, vy, vw, vh);

    // Vessel Title & Live pH Readout Badge on top of vessel
    ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
    ctx.fillRect(vx + 12, vy + 10, vw - 24, 34);
    ctx.fillStyle = '#4ade80';
    ctx.font = 'bold 16px Prompt';
    ctx.fillText(`ขวดสารละลายบัฟเฟอร์ : pH = ${bufSim.bufferPH.toFixed(2)}`, vx + 24, vy + 33);
    ctx.fillStyle = '#94a3b8';
    ctx.font = '13px Prompt';
    ctx.fillText(`(เทียบกับน้ำกลั่น pH = ${bufSim.waterPH.toFixed(2)})`, vx + 235, vy + 33);

    // Update and draw floating molecules inside Buffer Vessel
    const scaleMol = bufSim.isPreparing ? Math.max(0.2, (bufSim.prepProgress - 0.3) / 0.7) : 1.0;
    if (scaleMol > 0.25) {
      bufSim.molecules.forEach(m => {
        if (!m.busy) {
          m.x += m.vx;
          m.y += m.vy;
          if (m.x < vx + 32 || m.x > vx + vw - 32) m.vx *= -1;
          if (m.y < waterTop + 28 || m.y > vy + vh - 28) m.vy *= -1;
        }
        drawMoleculeCluster(ctx, m.type, m.x, m.y, m.busy);
      });
    }

    // Update and draw Incoming Acid (H+) or Base (OH-) Drops & Active Molecular Interception!
    for (let i = bufSim.incomingDrops.length - 1; i >= 0; i--) {
      const drop = bufSim.incomingDrops[i];
      if (!drop.inWater) {
        drop.y += 4.2;
        if (drop.y >= drop.surfaceY) {
          drop.inWater = true;
          bufSim.ripples.push({ x: drop.x, y: drop.surfaceY, r: 6, alpha: 1.0 });
        }
      } else if (drop.targetMol) {
        // Active interception! The target buffer molecule swims rapidly toward the incoming ion!
        const tm = drop.targetMol;
        const dx = drop.x - tm.x;
        const dy = (drop.y + 45) - tm.y;
        const dist = Math.hypot(dx, dy);

        // Move drop slightly deeper and move target molecule rapidly toward drop
        if (drop.y < 310) drop.y += 1.2;
        tm.x += (dx / Math.max(1, dist)) * 5.2;
        tm.y += (dy / Math.max(1, dist)) * 5.2;

        // Draw dashed targeting line showing which buffer component is rushing to capture!
        ctx.save();
        ctx.strokeStyle = drop.kind === 'H+' ? '#38bdf8' : '#f472b6';
        ctx.lineWidth = 2.5;
        ctx.setLineDash([5, 4]);
        ctx.beginPath();
        ctx.moveTo(tm.x, tm.y);
        ctx.lineTo(drop.x, drop.y);
        ctx.stroke();
        ctx.restore();

        // Action label right next to the swimming molecule
        ctx.fillStyle = '#facc15';
        ctx.font = 'bold 13px Prompt';
        const actionTxt = drop.kind === 'H+'
          ? '⚡ CH₃COO⁻ วิ่งเข้าจับ H⁺!'
          : '⚡ CH₃COOH วิ่งเข้าสกัด OH⁻!';
        ctx.fillText(actionTxt, (tm.x + drop.x) / 2 - 60, (tm.y + drop.y) / 2 - 12);

        if (dist < 48) {
          // Collision & Reaction Transformation!
          SoundFX.chime();
          bufSim.flashRings.push({
            x: drop.x,
            y: drop.y,
            r: 10,
            alpha: 1.0,
            color: drop.kind === 'H+' ? '#facc15' : '#38bdf8',
            eqText: drop.kind === 'H+'
              ? 'CH₃COO⁻ + H⁺ ⟶ CH₃COOH'
              : 'CH₃COOH + OH⁻ ⟶ CH₃COO⁻ + H₂O'
          });

          if (drop.kind === 'H+') {
            // CH3COO- captured H+ and turned into CH3COOH!
            tm.type = 'HA';
            tm.busy = false;
            bufSim.aMinusCount = Math.max(0, bufSim.aMinusCount - 1);
            bufSim.haCount++;
            bufSim.deltaAMinus = -1;
            bufSim.deltaHA = +1;
            bufSim.waterPH = 1.85;
            recalcBufferPH();
            bufSim.lastEventColor = '#4ade80';
            bufSim.lastEventBanner = `⚡ หยดกรด H⁺: คู่เบส CH₃COO⁻ วิ่งเข้าจับ H⁺ กลายเป็น CH₃COOH! ([CH₃COO⁻] ลดลง ↓ , [CH₃COOH] เพิ่มขึ้น ↑ , pH = ${bufSim.bufferPH.toFixed(2)})`;
            updateBufferExplanation(
              'ผลของการหยดกรดแก่ (H⁺) ลงในบัฟเฟอร์',
              `• ทันทีที่ <b>H⁺</b> ลงสู่สารละลาย ไอออนคู่เบส <b style="color:#38bdf8;">CH₃COO⁻</b> จะวิ่งเข้าไปจับ H⁺ ทันทีตามสมการ:<br><b style="color:#facc15;">CH₃COO⁻(aq) + H⁺(aq) ⟶ CH₃COOH(aq)</b><br>• ผลลัพธ์: ความเข้มข้น <b>[CH₃COO⁻] ลดลง (เหลือ ${bufSim.aMinusCount})</b> และ <b>[CH₃COOH] เพิ่มขึ้น (เป็น ${bufSim.haCount})</b> ไฮโดรเจนไอออนที่เติมลงไปถูกกำจัดหมด ค่า pH จึงแทบไม่เปลี่ยน!`
            );
          } else {
            // CH3COOH donated H+ to OH- and turned into CH3COO- + H2O!
            tm.type = 'A-';
            tm.busy = false;
            bufSim.haCount = Math.max(0, bufSim.haCount - 1);
            bufSim.aMinusCount++;
            bufSim.deltaHA = -1;
            bufSim.deltaAMinus = +1;
            bufSim.waterPH = 12.15;
            recalcBufferPH();
            bufSim.lastEventColor = '#38bdf8';
            bufSim.lastEventBanner = `⚡ หยดเบส OH⁻: กรดอ่อน CH₃COOH วิ่งไปจ่าย H⁺ สกัด OH⁻ กลายเป็น CH₃COO⁻ + H₂O! ([CH₃COOH] ลดลง ↓ , [CH₃COO⁻] เพิ่มขึ้น ↑ , pH = ${bufSim.bufferPH.toFixed(2)})`;
            updateBufferExplanation(
              'ผลของการหยดเบสแก่ (OH⁻) ลงในบัฟเฟอร์',
              `• ทันทีที่ <b>OH⁻</b> ลงสู่สารละลาย โมเลกุลกรดอ่อน <b style="color:#f472b6;">CH₃COOH</b> จะวิ่งเข้าไปจ่ายโปรตอน H⁺ สกัด OH⁻ ให้กลายเป็นน้ำทันทีตามสมการ:<br><b style="color:#facc15;">CH₃COOH(aq) + OH⁻(aq) ⟶ CH₃COO⁻(aq) + H₂O(l)</b><br>• ผลลัพธ์: ความเข้มข้น <b>[CH₃COOH] ลดลง (เหลือ ${bufSim.haCount})</b> และ <b>[CH₃COO⁻] เพิ่มขึ้น (เป็น ${bufSim.aMinusCount})</b> ค่า pH จึงแทบไม่เปลี่ยน!`
            );
          }
          bufSim.incomingDrops.splice(i, 1);
          continue;
        }
      } else {
        // Buffer capacity exceeded! No molecule left to capture it!
        drop.y += 2.5;
        if (drop.y > 420) {
          if (drop.kind === 'H+') bufSim.bufferPH = 1.80;
          else bufSim.bufferPH = 12.20;
          bufSim.lastEventColor = '#ef4444';
          bufSim.lastEventBanner = `⚠️ เกินความจุบัฟเฟอร์ (Buffer Capacity Exceeded)! สารตัวจับหมดแล้ว ทำให้ pH เปลี่ยนแปลงอย่างรุนแรงเป็น ${bufSim.bufferPH.toFixed(2)}!`;
          bufSim.incomingDrops.splice(i, 1);
          continue;
        }
      }

      // Draw the incoming H+ or OH- ion
      ctx.save();
      ctx.beginPath();
      ctx.arc(drop.x, drop.y, 16, 0, Math.PI * 2);
      ctx.fillStyle = drop.kind === 'H+' ? '#facc15' : '#a855f7';
      ctx.shadowColor = drop.kind === 'H+' ? '#facc15' : '#a855f7';
      ctx.shadowBlur = 16;
      ctx.fill();
      ctx.fillStyle = drop.kind === 'H+' ? '#0f172a' : '#ffffff';
      ctx.font = 'bold 13px Prompt';
      ctx.fillText(drop.kind, drop.x - (drop.kind === 'H+' ? 9 : 13), drop.y + 5);
      ctx.restore();
    }

    // Draw surface ripples
    for (let i = bufSim.ripples.length - 1; i >= 0; i--) {
      const rp = bufSim.ripples[i];
      rp.r += 2.2;
      rp.alpha -= 0.04;
      if (rp.alpha <= 0) {
        bufSim.ripples.splice(i, 1);
        continue;
      }
      ctx.strokeStyle = `rgba(56, 189, 248, ${rp.alpha})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(rp.x, rp.y, rp.r, rp.r * 0.28, 0, 0, Math.PI * 2);
      ctx.stroke();
    }

    // Draw reaction collision flash rings & floating equation text
    for (let i = bufSim.flashRings.length - 1; i >= 0; i--) {
      const fl = bufSim.flashRings[i];
      fl.r += 2.4;
      fl.alpha -= 0.022;
      if (fl.alpha <= 0) {
        bufSim.flashRings.splice(i, 1);
        continue;
      }
      ctx.save();
      ctx.strokeStyle = fl.color;
      ctx.globalAlpha = fl.alpha;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(fl.x, fl.y, fl.r, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 15px Prompt';
      ctx.fillText(fl.eqText, fl.x - 105, fl.y - fl.r - 8);
      ctx.restore();
    }

    // =========================================================================
    // ZONE 3 (RIGHT: x = 805..1120): แผงวัดความเข้มข้น [CH3COOH] vs [CH3COO-] แบบสด
    // =========================================================================
    ctx.fillStyle = 'rgba(15, 23, 42, 0.65)';
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(805, 68, 315, 535, 12);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#facc15';
    ctx.font = 'bold 15.5px Prompt';
    ctx.fillText('การเปลี่ยนแปลงความเข้มข้นในบัฟเฟอร์', 822, 96);

    const maxBarH = 250;
    const barBaseY = 425;
    const hHA = Math.min(maxBarH, (bufSim.haCount / 16) * maxBarH);
    const hAM = Math.min(maxBarH, (bufSim.aMinusCount / 16) * maxBarH);

    // Bar 1: [CH3COOH] (Weak Acid)
    ctx.fillStyle = 'rgba(244, 114, 182, 0.15)';
    ctx.strokeStyle = '#475569';
    ctx.strokeRect(845, barBaseY - maxBarH, 85, maxBarH);

    const gradHA = ctx.createLinearGradient(0, barBaseY - hHA, 0, barBaseY);
    gradHA.addColorStop(0, '#f472b6');
    gradHA.addColorStop(1, '#be185d');
    ctx.fillStyle = gradHA;
    ctx.fillRect(845, barBaseY - hHA, 85, hHA);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px Prompt';
    ctx.fillText('[CH₃COOH]', 846, barBaseY + 24);
    ctx.fillStyle = '#f472b6';
    ctx.font = '12.5px Prompt';
    ctx.fillText(`(${bufSim.haCount} โมเลกุล)`, 852, barBaseY + 44);

    if (bufSim.deltaHA !== 0) {
      ctx.fillStyle = bufSim.deltaHA > 0 ? '#4ade80' : '#f87171';
      ctx.font = 'bold 15px Prompt';
      ctx.fillText(bufSim.deltaHA > 0 ? '▲ เพิ่มขึ้น!' : '▼ ลดลง!', 850, barBaseY - hHA - 10);
    }

    // Bar 2: [CH3COO-] (Conjugate Base)
    ctx.fillStyle = 'rgba(56, 189, 248, 0.15)';
    ctx.strokeStyle = '#475569';
    ctx.strokeRect(985, barBaseY - maxBarH, 85, maxBarH);

    const gradAM = ctx.createLinearGradient(0, barBaseY - hAM, 0, barBaseY);
    gradAM.addColorStop(0, '#38bdf8');
    gradAM.addColorStop(1, '#0369a1');
    ctx.fillStyle = gradAM;
    ctx.fillRect(985, barBaseY - hAM, 85, hAM);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px Prompt';
    ctx.fillText('[CH₃COO⁻]', 986, barBaseY + 24);
    ctx.fillStyle = '#38bdf8';
    ctx.font = '12.5px Prompt';
    ctx.fillText(`(${bufSim.aMinusCount} ไอออน)`, 996, barBaseY + 44);

    if (bufSim.deltaAMinus !== 0) {
      ctx.fillStyle = bufSim.deltaAMinus > 0 ? '#4ade80' : '#f87171';
      ctx.font = 'bold 15px Prompt';
      ctx.fillText(bufSim.deltaAMinus > 0 ? '▲ เพิ่มขึ้น!' : '▼ ลดลง!', 990, barBaseY - hAM - 10);
    }

    // Summary Box at bottom of Zone 3
    ctx.fillStyle = 'rgba(30, 41, 59, 0.9)';
    ctx.strokeStyle = '#475569';
    ctx.beginPath();
    ctx.roundRect(820, 485, 285, 102, 8);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#e2e8f0';
    ctx.font = '13px Prompt';
    ctx.fillText(`• สัดส่วน [CH₃COO⁻]/[CH₃COOH] = ${bufSim.aMinusCount} / ${bufSim.haCount}`, 832, 512);
    ctx.fillStyle = '#4ade80';
    ctx.font = 'bold 15px Prompt';
    ctx.fillText(`• pH บัฟเฟอร์ = ${bufSim.bufferPH.toFixed(2)} (คงที่!)`, 832, 540);
    ctx.fillStyle = '#f87171';
    ctx.font = '13px Prompt';
    ctx.fillText(`• ถ้าเป็นน้ำกลั่น pH จะเปลี่ยนเป็น ${bufSim.waterPH.toFixed(2)}`, 832, 568);
  };
}

// Initialize Application on Load
window.addEventListener('DOMContentLoaded', () => {
  buildSidebarTOC();
  goToSlide(0);
  initAccountAndSmartboardNotes();
});
</script>
